<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0C0C0C" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Cimine chose-neon — Avengers: Doomsday</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0C0C0C;
    color: #FFFFFF;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    touch-action: none;
  }

  /* Fullscreen WebGL canvas */
  #gl-canvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    display: block;
    z-index: 1;
    background: #0C0C0C;
  }

  /* Blackout veil that reveals the 3D theater during 0.0-0.8s */
  #theater-veil {
    position: fixed;
    inset: 0;
    background: #0C0C0C;
    z-index: 2;
    pointer-events: none;
    opacity: 1;
    will-change: opacity;
  }

  /* Look-around drag capture layer (active only in SEATED mode) */
  #look-layer {
    position: fixed;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    cursor: grab;
  }
  #look-layer.active {
    pointer-events: auto;
  }
  #look-layer.dragging {
    cursor: grabbing;
  }

  /* 1000x1000 scaled design stage for the 2D seat map */
  #map-stage {
    position: fixed;
    width: 1000px;
    height: 1000px;
    left: 0;
    top: 0;
    transform-origin: 0 0;
    z-index: 5;
    pointer-events: none;
  }

  /* Screen arc + subtle glow + SCREEN label */
  #screen-arc-group {
    position: absolute;
    left: 0;
    top: 0;
    width: 1000px;
    height: 1000px;
    pointer-events: none;
    will-change: opacity;
  }

  #screen-label {
    position: absolute;
    left: 500px;
    top: 281px;
    transform: translateX(-50%);
    font-size: 10.5px;
    font-weight: 500;
    letter-spacing: 0.34em;
    text-indent: 0.34em;
    color: rgba(255, 255, 255, 0.34);
    pointer-events: none;
  }

  /* Seat grid layers inside 1000x1000 stage */
  #seats-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  #seats-static-layer,
  #seats-selected-layer,
  #seats-ghost-layer,
  #seats-drag-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    will-change: opacity;
  }

  .row-label {
    position: absolute;
    transform: translate(-50%, -50%);
    font-size: 11.5px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.34);
    letter-spacing: 0.02em;
    pointer-events: none;
    width: 18px;
    text-align: center;
  }

  /* Individual seat unit: rounded square backrest + independent bottom short line */
  .seat-node {
    position: absolute;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: auto;
  }

  .seat-back {
    width: var(--sw, 27px);
    height: var(--sh, 24px);
    border-radius: 6.5px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11.5px;
    font-weight: 600;
    line-height: 1;
    transition: background-color 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease, transform 0.14s ease;
    position: relative;
  }

  .seat-bar {
    width: calc(var(--sw, 27px) * 0.64);
    height: 2.5px;
    border-radius: 2px;
    margin-top: 2.5px;
    transition: background-color 0.16s ease, opacity 0.16s ease;
  }

  /* Free seat */
  .seat-node.free {
    cursor: pointer;
  }
  .seat-node.free .seat-back {
    background: #0F1012;
    border: 1.2px solid rgba(255, 255, 255, 0.24);
    color: transparent;
  }
  .seat-node.free .seat-bar {
    background: rgba(255, 255, 255, 0.22);
  }
  .seat-node.free:hover .seat-back {
    border-color: rgba(255, 255, 255, 0.48);
    background: #16181D;
  }
  .seat-node.free:hover .seat-bar {
    background: rgba(255, 255, 255, 0.42);
  }

  /* Taken seat */
  .seat-node.taken {
    cursor: default;
    pointer-events: none;
  }
  .seat-node.taken .seat-back {
    background: #1B1B1B;
    border: 1.2px solid #222224;
    color: transparent;
  }
  .seat-node.taken .seat-bar {
    background: #1B1B1B;
  }

  /* Selected seat (Yours) */
  .seat-node.selected {
    cursor: grab;
    z-index: 4;
    touch-action: none;
  }
  .seat-node.selected::before {
    content: '';
    position: absolute;
    inset: -7px;
  }
  .seat-node.selected:active {
    cursor: grabbing;
  }
  .seat-node.selected .seat-back {
    background: linear-gradient(180deg, #4D8CF7 0%, #3E7CEB 100%);
    border: 1.2px solid rgba(135, 184, 255, 0.55);
    color: #FFFFFF;
    box-shadow: 0 3px 12px rgba(65, 129, 240, 0.34);
  }
  .seat-node.selected .seat-bar {
    background: #4181F0;
    box-shadow: 0 0 8px rgba(65, 129, 240, 0.45);
  }
  .seat-node.selected:hover .seat-back {
    background: linear-gradient(180deg, #5895FA 0%, #4483F2 100%);
    box-shadow: 0 4px 16px rgba(65, 129, 240, 0.48);
  }

  /* Candidate target hollow blue outline while dragging */
  .seat-node.ghost {
    pointer-events: none;
    z-index: 3;
  }
  .seat-node.ghost .seat-back {
    background: rgba(65, 129, 240, 0.08);
    border: 1.5px solid #4181F0;
    color: transparent;
    box-shadow: 0 0 12px rgba(65, 129, 240, 0.25);
  }
  .seat-node.ghost .seat-bar {
    background: rgba(65, 129, 240, 0.72);
  }

  /* Lifted floating blue seats during drag */
  .drag-cluster {
    position: absolute;
    left: 0;
    top: 0;
    pointer-events: none;
    z-index: 20;
    will-change: transform;
  }
  .drag-cluster .seat-node.lifted {
    pointer-events: none;
  }
  .drag-cluster .seat-node.lifted .seat-back {
    background: linear-gradient(180deg, #5695FA 0%, #3E7EEB 100%);
    border: 1.3px solid rgba(168, 204, 255, 0.78);
    color: #FFFFFF;
    box-shadow: 0 12px 26px rgba(0, 0, 0, 0.65), 0 4px 18px rgba(65, 129, 240, 0.50);
  }
  .drag-cluster .seat-node.lifted .seat-bar {
    background: #4F8EF7;
    box-shadow: 0 4px 12px rgba(65, 129, 240, 0.55);
  }

  /* Floating white candidate tooltip pill above cursor (~25px) */
  #drag-tooltip {
    position: fixed;
    left: 0;
    top: 0;
    z-index: 40;
    pointer-events: none;
    padding: 5px 11px;
    border-radius: 999px;
    background: #F4F5F7;
    color: #0C0C0C;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: -0.01em;
    white-space: nowrap;
    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.58), 0 1px 2px rgba(0, 0, 0, 0.25);
    opacity: 0;
    transform-origin: 50% 100%;
    transform: translate(-50%, -100%) scale(calc(var(--tip-scale, 1) * 0.92));
    transition: opacity 0.14s ease, transform 0.14s ease;
    will-change: left, top, opacity, transform;
  }
  #drag-tooltip.visible {
    opacity: 1;
    transform: translate(-50%, -100%) scale(var(--tip-scale, 1));
  }

  /* Legend at y=678 */
  #legend-row {
    position: absolute;
    left: 500px;
    top: 678px;
    transform: translate(-50%, -50%);
    display: flex;
    align-items: center;
    gap: 28px;
    pointer-events: none;
    will-change: opacity;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.54);
  }
  .legend-icon {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .legend-icon .lb {
    width: 13px;
    height: 11.5px;
    border-radius: 3.5px;
  }
  .legend-icon .ll {
    width: 8.5px;
    height: 1.8px;
    border-radius: 1px;
    margin-top: 1.5px;
  }
  .legend-icon.free .lb {
    background: #0F1012;
    border: 1.2px solid rgba(255, 255, 255, 0.30);
  }
  .legend-icon.free .ll {
    background: rgba(255, 255, 255, 0.26);
  }
  .legend-icon.taken .lb {
    background: #232326;
    border: 1px solid #2A2A2E;
  }
  .legend-icon.taken .ll {
    background: #232326;
  }
  .legend-icon.yours .lb {
    background: #4181F0;
    border: 1px solid rgba(135, 184, 255, 0.5);
  }
  .legend-icon.yours .ll {
    background: #4181F0;
  }

  /* Divider line at y=709 inside map stage */
  #map-divider {
    position: absolute;
    left: 244px;
    top: 709px;
    width: 512px;
    height: 1px;
    background: rgba(255, 255, 255, 0.10);
    pointer-events: none;
    will-change: opacity;
  }

  /* =========================================================
     Floating HUD Elements (smoothly animate between 1000x1000
     design coordinates and viewport-pinned preview positions)
     ========================================================= */
  .hud-block {
    position: fixed;
    left: 0;
    top: 0;
    transform-origin: 0 0;
    z-index: 15;
    will-change: transform;
  }

  /* Top-left movie header */
  #hud-header {
    pointer-events: none;
  }
  .movie-title {
    font-size: 23px;
    font-weight: 600;
    letter-spacing: -0.025em;
    line-height: 1.18;
    color: #F6F7F9;
    white-space: nowrap;
    text-shadow: 0 2px 14px rgba(0, 0, 0, 0.55);
  }
  .movie-meta {
    margin-top: 4px;
    font-size: 16px;
    font-weight: 400;
    letter-spacing: -0.01em;
    line-height: 1.25;
    color: rgba(255, 255, 255, 0.48);
    white-space: nowrap;
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.55);
  }

  /* Top-right ticket stepper pill: 188 x 48 px */
  #hud-stepper {
    width: 188px;
    height: 48px;
    border-radius: 24px;
    background: linear-gradient(180deg, rgba(31, 32, 37, 0.92) 0%, rgba(21, 22, 26, 0.92) 100%);
    border: 1px solid rgba(255, 255, 255, 0.095);
    box-shadow: 0 8px 26px rgba(0, 0, 0, 0.42), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 7px;
    pointer-events: auto;
  }

  .step-btn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: none;
    background: rgba(255, 255, 255, 0.085);
    color: rgba(255, 255, 255, 0.88);
    font-size: 18px;
    font-weight: 400;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background-color 0.15s ease, color 0.15s ease, transform 0.12s ease;
  }
  .step-btn:hover:not(:disabled) {
    background: rgba(255, 255, 255, 0.15);
    color: #FFFFFF;
  }
  .step-btn:active:not(:disabled) {
    transform: scale(0.93);
  }
  .step-btn:disabled {
    opacity: 0.30;
    cursor: not-allowed;
  }

  #ticket-count-label {
    font-size: 14.5px;
    font-weight: 500;
    letter-spacing: -0.01em;
    color: rgba(255, 255, 255, 0.90);
    white-space: nowrap;
  }

  /* Bottom purchase dock: 512px wide */
  #hud-bottom {
    width: 512px;
    pointer-events: auto;
  }

  /* Mini seat map floating above the bottom dock in seated preview */
  #mini-map-wrap {
    position: absolute;
    left: 50%;
    bottom: 118px;
    transform: translateX(-50%) translateY(8px);
    width: 400px;
    height: 100px;
    overflow: hidden;
    pointer-events: none;
    opacity: 0;
    will-change: opacity, transform;
    background: radial-gradient(ellipse 68% 62% at 50% 50%, rgba(10, 11, 14, 0.62) 0%, rgba(10, 11, 14, 0.28) 58%, rgba(10, 11, 14, 0) 100%);
    -webkit-mask-image: linear-gradient(
      to bottom,
      transparent 0%,
      rgba(0, 0, 0, 0.45) 18%,
      rgba(0, 0, 0, 0.95) 36%,
      rgba(0, 0, 0, 1) 50%,
      rgba(0, 0, 0, 0.95) 64%,
      rgba(0, 0, 0, 0.45) 82%,
      transparent 100%
    );
    mask-image: linear-gradient(
      to bottom,
      transparent 0%,
      rgba(0, 0, 0, 0.45) 18%,
      rgba(0, 0, 0, 0.95) 36%,
      rgba(0, 0, 0, 1) 50%,
      rgba(0, 0, 0, 0.95) 64%,
      rgba(0, 0, 0, 0.45) 82%,
      transparent 100%
    );
  }
  #mini-map-wrap.interactive {
    pointer-events: auto;
  }

  #mini-map-track {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    transition: transform 0.36s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .mini-row {
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: opacity 0.28s ease, filter 0.28s ease, transform 0.28s ease;
  }
  .mini-row.is-active {
    opacity: 1;
    filter: none;
  }
  .mini-row.is-near {
    opacity: 0.64;
    filter: blur(1.2px);
  }
  .mini-row.is-far {
    opacity: 0.24;
    filter: blur(2.4px);
  }

  .mini-row-label {
    width: 14px;
    text-align: center;
    font-size: 10px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.66);
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9);
  }
  .mini-side {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .mini-aisle {
    width: 24px;
  }
  .mini-seat {
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: default;
  }
  .mini-row.is-active .mini-seat.free {
    cursor: pointer;
  }
  .mini-seat-back {
    width: 18px;
    height: 16px;
    border-radius: 4.5px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9.5px;
    font-weight: 700;
    line-height: 1;
  }
  .mini-seat-bar {
    width: 11px;
    height: 1.8px;
    border-radius: 1px;
    margin-top: 1.8px;
  }
  .mini-seat.free .mini-seat-back {
    background: rgba(15, 16, 20, 0.56);
    border: 1.1px solid rgba(255, 255, 255, 0.42);
    color: transparent;
  }
  .mini-seat.free .mini-seat-bar {
    background: rgba(255, 255, 255, 0.36);
  }
  .mini-row.is-active .mini-seat.free:hover .mini-seat-back {
    border-color: rgba(255, 255, 255, 0.72);
    background: rgba(34, 38, 46, 0.82);
  }
  .mini-seat.taken .mini-seat-back {
    background: rgba(46, 48, 54, 0.72);
    border: 1px solid rgba(255, 255, 255, 0.12);
    color: transparent;
  }
  .mini-seat.taken .mini-seat-bar {
    background: rgba(46, 48, 54, 0.68);
  }
  .mini-seat.selected .mini-seat-back {
    background: linear-gradient(180deg, #5292FA 0%, #3E7EEB 100%);
    border: 1px solid rgba(175, 210, 255, 0.80);
    color: #FFFFFF;
    box-shadow: 0 2px 10px rgba(65, 129, 240, 0.60);
  }
  .mini-seat.selected .mini-seat-bar {
    background: #5594FA;
  }

  /* Summary info row above the 2 pill buttons */
  .summary-row {
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
    padding: 0 2px;
  }
  #summary-seats {
    font-size: 16px;
    font-weight: 500;
    letter-spacing: -0.015em;
    color: #F2F3F5;
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.65);
  }
  #summary-price {
    font-size: 15.5px;
    font-weight: 400;
    letter-spacing: -0.01em;
    color: rgba(255, 255, 255, 0.50);
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.65);
  }

  /* Action buttons row: 168 + 12 + 332 = 512px, height 64px */
  .action-row {
    display: flex;
    align-items: center;
    gap: 12px;
    height: 64px;
  }

  #btn-preview {
    width: 168px;
    height: 64px;
    border-radius: 32px;
    border: 1px solid rgba(255, 255, 255, 0.14);
    background: linear-gradient(180deg, rgba(30, 31, 36, 0.90) 0%, rgba(20, 21, 25, 0.92) 100%);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    color: #F3F4F6;
    font-family: inherit;
    font-size: 16px;
    font-weight: 500;
    letter-spacing: -0.01em;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    cursor: pointer;
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    transition: background 0.18s ease, border-color 0.18s ease, transform 0.14s ease;
  }
  #btn-preview:hover {
    border-color: rgba(255, 255, 255, 0.26);
    background: linear-gradient(180deg, rgba(40, 42, 48, 0.94) 0%, rgba(27, 28, 34, 0.95) 100%);
  }
  #btn-preview:active {
    transform: scale(0.975);
  }
  #btn-preview .icon-slot {
    width: 20px;
    height: 20px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  #btn-preview svg {
    position: absolute;
    transition: opacity 0.28s ease, transform 0.28s ease;
  }
  #icon-cube {
    opacity: 1;
    transform: scale(1);
  }
  #icon-grid {
    opacity: 0;
    transform: scale(0.75);
  }
  #btn-preview.is-seats #icon-cube {
    opacity: 0;
    transform: scale(0.75);
  }
  #btn-preview.is-seats #icon-grid {
    opacity: 1;
    transform: scale(1);
  }

  #btn-book {
    width: 332px;
    height: 64px;
    border-radius: 32px;
    border: none;
    background: linear-gradient(180deg, #F4F5F7 0%, #E7E8EC 100%);
    color: #0C0C0C;
    font-family: inherit;
    font-size: 16.5px;
    font-weight: 600;
    letter-spacing: -0.015em;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.85);
    transition: filter 0.16s ease, transform 0.14s ease, box-shadow 0.18s ease;
  }
  #btn-book:hover {
    filter: brightness(1.04);
    box-shadow: 0 12px 34px rgba(0, 0, 0, 0.55), 0 0 22px rgba(255, 255, 255, 0.12);
  }
  #btn-book:active {
    transform: scale(0.985);
  }

  /* Booking toast confirmation */
  #booking-toast {
    position: fixed;
    left: 50%;
    top: 28px;
    transform: translate(-50%, -18px);
    z-index: 60;
    padding: 12px 22px;
    border-radius: 999px;
    background: rgba(244, 245, 247, 0.96);
    color: #0C0C0C;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -0.01em;
    box-shadow: 0 14px 36px rgba(0, 0, 0, 0.6);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.28s ease, transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
  }
  #booking-toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
  }

  /* Global dragging cursor override */
  body.is-dragging-seats,
  body.is-dragging-seats * {
    cursor: grabbing !important;
  }
</style>
</head>
<body>
  <canvas id="gl-canvas"></canvas>
  <div id="theater-veil"></div>
  <div id="look-layer" aria-label="Drag horizontally to look around the theater"></div>

  <!-- 1000 x 1000 scaled design canvas for the 2D seat map -->
  <div id="map-stage">
    <div id="screen-arc-group">
      <svg width="1000" height="1000" viewBox="0 0 1000 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="screenGlowGrad" x1="500" y1="260" x2="500" y2="314" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14"/>
            <stop offset="42%" stop-color="#D8DCE6" stop-opacity="0.045"/>
            <stop offset="100%" stop-color="#0C0C0C" stop-opacity="0"/>
          </linearGradient>
          <linearGradient id="screenStrokeGrad" x1="284" y1="274" x2="716" y2="274" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.08"/>
            <stop offset="18%" stop-color="#FFFFFF" stop-opacity="0.38"/>
            <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.58"/>
            <stop offset="82%" stop-color="#FFFFFF" stop-opacity="0.38"/>
            <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.08"/>
          </linearGradient>
        </defs>
        <!-- Soft grey glow beneath the arc -->
        <path d="M 284 274 Q 500 246 716 274 L 694 316 Q 500 294 306 316 Z" fill="url(#screenGlowGrad)"/>

          onerror="var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js';s.onload=window.__bootCinemaApp;s.onerror=function(){var s2=document.createElement('script');s2.src='https://unpkg.com/three@0.147.0/build/three.min.js';s2.onload=window.__bootCinemaApp;document.head.appendChild(s2);};document.head.appendChild(s);"></script>

  <script>
  (function () {
    'use strict';

    function bootApp() {
      if (window.__cinemaBooted || typeof THREE === 'undefined') return;
      window.__cinemaBooted = true;

      /* =====================================================================
         1. EXACT CINEMA GEOMETRY & 3D-TO-2D PROJECTION CONSTANTS
            Solved so the 96 real 3D seat cushions project under the Overview
            Camera to rows y = [333, 371, 410, 451, 493, 536, 581, 628]
            within < 0.37px error on the 1000x1000 design canvas!
         ===================================================================== */
      const ROWS = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
      const SEATS_PER_ROW = 12;
      const TICKET_PRICE = 12.0;

      // Fixed taken seats distribution (exact match to specification)
      const TAKEN_MAP = {
        0: [1, 2, 11],                   // A: 1/2/11
        1: [5, 6],                       // B: 5/6
        2: [3, 4, 9, 10],                // C: 3/4/9/10
        3: [1, 7, 8, 9],                 // D: 1/7/8/9
        4: [2, 3, 4, 11, 12],            // E: 2/3/4/11/12
        5: [1, 2, 10, 11, 12],           // F: 1/2/10/11/12
        6: [3, 4, 5, 6, 7, 8],           // G: 3/4/5/6/7/8
        7: [1, 2, 3, 9, 10, 11, 12]      // H: 1/2/3/9/10/11/12
      };

      const isTaken = (r, c) => TAKEN_MAP[r].includes(c);

      // Physical boutique theater dimensions (meters)
      const GEOM = {
        zA: 3.80,             // Row A cushion center Z (screen is at z = 0)
        dz: 1.12,             // Row pitch
        floorA: 0.20,         // Row A platform floor Y
        dy: 0.22,             // Tier step height per row
        cushionOffsetY: 0.48, // Cushion top center above tier floor (yA = 0.68)
        eyeOffsetY: 1.21,     // Seated eye height above tier floor (lower third shows front seatbacks cleanly)
        dxSeat: 0.803,        // Seat horizontal center-to-center pitch
        aisleCenterGap: 2.069,// Center-to-center gap between seat 6 and seat 7
        hallHalfW: 6.35,      // Side wall X = ±6.35m (12.7m wide boutique hall)
        ceilingY: 7.05,       // Black acoustic ceiling height
        backWallZ: 14.35,     // Back wall behind Row H
        screenW: 9.20,        // 2.35:1 scope screen width (occupies ~70% viewport width from E5-6)
        screenH: 3.92,        // Screen height
        screenCenterY: 3.30,  // Screen vertical center (bottom y=1.34, top y=5.26)
        stageHeight: 0.56,    // Low dark matte stage beneath screen
        stageDepth: 1.75
      };

      // Overview camera parameters (exact sub-pixel match to 2D map)
      const OVERVIEW_CAM = {
        fovDesign: 48.001,
        pitchDeg: 76.015,
        y: 27.806,
        z: 15.000
      };

      function getSeatWorld(r, c) {
        // c is 1..12; left block 1..6, right block 7..12
        const halfAisle = GEOM.aisleCenterGap * 0.5;
        let x;
        if (c <= 6) {
          x = -(halfAisle + (6 - c) * GEOM.dxSeat);
        } else {
          x = halfAisle + (c - 7) * GEOM.dxSeat;
        }
        const floorY = GEOM.floorA + r * GEOM.dy;
        const y = floorY + GEOM.cushionOffsetY;
        const z = GEOM.zA + r * GEOM.dz;
        return { x, y, z, floorY };
      }

      // Project a 3D world point through OVERVIEW_CAM onto the 1000x1000 design canvas
      function projectOverviewDesign(x, y, z) {
        const p = THREE.MathUtils.degToRad(OVERVIEW_CAM.pitchDeg);
        const cp = Math.cos(p), sp = Math.sin(p);
        const py = y - OVERVIEW_CAM.y;
        const pz = z - OVERVIEW_CAM.z;
        const depth = -py * sp - pz * cp;
        const yView = py * cp - pz * sp;
        const f = 500.0 / Math.tan(THREE.MathUtils.degToRad(OVERVIEW_CAM.fovDesign * 0.5));
        return {
          x: 500.0 + (x / depth) * f,
          y: 500.0 - (yView / depth) * f,
          pxPerMeter: f / depth
        };
      }

      // Precompute all 96 seat layout records (3D world + exact 2D design projection)
      const SEATS = [];
      const SEAT_BY_RC = Array.from({ length: 8 }, () => new Array(13));
      const ROW_PROJ = [];

      for (let r = 0; r < 8; r++) {
        const wSample = getSeatWorld(r, 1);
        const pSample = projectOverviewDesign(wSample.x, wSample.y, wSample.z);
        const pRight = projectOverviewDesign(-wSample.x, wSample.y, wSample.z);
        ROW_PROJ.push({
          row: r,
          y: pSample.y,
          leftX: pSample.x,
          rightX: pRight.x,
          pxPerMeter: pSample.pxPerMeter
        });
        for (let c = 1; c <= 12; c++) {
          const w = getSeatWorld(r, c);
          const pr = projectOverviewDesign(w.x, w.y, w.z);
          // Match 3D cushion visual width (~0.64m * pxPerMeter => ~25.5px in A, ~27px in E, ~28.5px in H)
          const sw = Math.max(24.5, Math.min(29.0, 0.65 * pr.pxPerMeter));
          const sh = sw * 0.89;
          const rec = {
            r, c,
            side: c <= 6 ? 0 : 1,
            taken: isTaken(r, c),
            world: w,
            dx: pr.x,
            dy: pr.y,
            sw,
            sh
          };
          SEATS.push(rec);
          SEAT_BY_RC[r][c] = rec;
        }
      }

      /* =====================================================================
         2. APPLICATION STATE
         ===================================================================== */
      const state = {
        ticketCount: 2,
        selectedRow: 6,        // Row G (0-indexed)
        selectedCols: [9, 10], // Initial selection: G9, G10
        mode: 'MAP',           // 'MAP' | 'FLY_IN' | 'SEATED' | 'FLY_OUT'
        animTime: 0,           // 0..4.0 seconds
        animDir: 1,
        // Seated look-around
        lookYaw: 0,
        lookYawTarget: 0,
        lookPitchOffset: 0,
        lookPitchTarget: 0,
        hasLookedAround: false,
        // Seated camera shift smoothing (when changing seats via stepper/mini-map in preview)
        seatedCamPos: null,
        seatedCamYaw: 0,
        seatedCamPitch: 0,
        // Dragging seats state
        drag: {
          active: false,
          pointerId: null,
          grabOffsetX: 0,
          grabOffsetY: 0,
          clusterX: 0,
          clusterY: 0,
          candidate: null, // { r, cols }
          relSeats: []     // [{ col, ox, oy, sw, sh }]
        },
        // Viewport metrics
        vw: window.innerWidth,
        vh: window.innerHeight,
        designScale: 1,
        designOriginX: 0,
        designOriginY: 0
      };

      function getAllValidGroups(count) {
        const groups = [];
        for (let r = 0; r < 8; r++) {
          // Left side: 1..6, Right side: 7..12
          const blocks = [[1, 6], [7, 12]];
          for (const [start, end] of blocks) {
            for (let c0 = start; c0 <= end - count + 1; c0++) {
              let ok = true;
              const cols = [];
              for (let k = 0; k < count; k++) {
                if (isTaken(r, c0 + k)) { ok = false; break; }
                cols.push(c0 + k);
              }
              if (ok) {
                let cx = 0, cy = 0;
                for (const col of cols) {
                  cx += SEAT_BY_RC[r][col].dx;
                  cy += SEAT_BY_RC[r][col].dy;
                }
                cx /= count;
                cy /= count;
                groups.push({ r, cols, cx, cy });
              }
            }
          }
        }
        return groups;
      }

      function findNearestValidGroup(designX, designY, count) {
        const groups = getAllValidGroups(count);
        let best = null, bestD2 = Infinity;
        for (const g of groups) {
          const dx = g.cx - designX;
          const dy = g.cy - designY;
          const d2 = dx * dx + dy * dy;
          if (d2 < bestD2) {
            bestD2 = d2;
            best = g;
          }
        }
        return best;
      }

      function formatSeatRange(cols) {
        if (cols.length === 1) return `${cols[0]}`;
        return `${cols[0]}–${cols[cols.length - 1]}`;
      }

      function getSeatedTargetForSelection(r, cols) {
        let sx = 0, sz = 0, floorY = 0;
        for (const c of cols) {
          const w = SEAT_BY_RC[r][c].world;
          sx += w.x;
          sz += w.z;
          floorY += w.floorY;
        }
        sx /= cols.length;
        sz /= cols.length;
        floorY /= cols.length;

        const eyePos = new THREE.Vector3(sx, floorY + GEOM.eyeOffsetY, sz + 0.12);
        // Natural slight gaze toward screen center (x=0, y slightly below screen midpoint so lower third shows front seatbacks)
        const lookAt = new THREE.Vector3(sx * 0.10, GEOM.screenCenterY - 0.36, 0.0);
        const dir = new THREE.Vector3().subVectors(lookAt, eyePos).normalize();
        const yaw = Math.atan2(-dir.x, -dir.z);
        const pitch = Math.asin(THREE.MathUtils.clamp(dir.y, -0.95, 0.95));
        return { pos: eyePos, yaw, pitch };
      }

      /* =====================================================================
         3. PROCEDURAL TEXTURES (ALL GENERATED BY CODE)
         ===================================================================== */
      function createFabricNormalAndRoughness() {
        const size = 256;
        const cBump = document.createElement('canvas');
        cBump.width = cBump.height = size;
        const ctx = cBump.getContext('2d');
        ctx.fillStyle = '#808080';
        ctx.fillRect(0, 0, size, size);

        // Woven velvet / acoustic upholstery micro-grain
        const img = ctx.getImageData(0, 0, size, size);
        const d = img.data;
        let seed = 1337;
        const rand = () => {
          seed = (seed * 16807) % 2147483647;
          return (seed - 1) / 2147483646;
        };
        for (let y = 0; y < size; y++) {
          for (let x = 0; x < size; x++) {
            const idx = (y * size + x) * 4;
            const weave = ((x & 3) < 2 ? 8 : -8) * ((y & 3) < 2 ? 1 : -1);
            const grain = (rand() - 0.5) * 34;
            const v = Math.max(0, Math.min(255, 128 + weave + grain));
            d[idx] = d[idx + 1] = d[idx + 2] = v;
            d[idx + 3] = 255;
          }
        }
        ctx.putImageData(img, 0, 0);
        const tex = new THREE.CanvasTexture(cBump);
        tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(3, 3);
        return tex;
      }

      function createCarpetTexture() {
        const size = 512;
        const c = document.createElement('canvas');
        c.width = c.height = size;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#151619';
        ctx.fillRect(0, 0, size, size);

        let seed = 9187;
        const rand = () => {
          seed = (seed * 16807) % 2147483647;
          return (seed - 1) / 2147483646;
        };
        const img = ctx.getImageData(0, 0, size, size);
        const d = img.data;
        for (let y = 0; y < size; y++) {
          for (let x = 0; x < size; x++) {
            const idx = (y * size + x) * 4;
            const rib = Math.sin(x * 0.45) * 2.5 + Math.sin(y * 0.15) * 1.5;
            const speckle = (rand() - 0.5) * 14;
            const base = 22 + rib + speckle;
            d[idx]     = Math.max(8, Math.min(48, base));
            d[idx + 1] = Math.max(8, Math.min(50, base + 0.5));
            d[idx + 2] = Math.max(10, Math.min(54, base + 2.2));
            d[idx + 3] = 255;
          }
        }
        ctx.putImageData(img, 0, 0);
        const tex = new THREE.CanvasTexture(c);
        tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(6, 12);
        tex.encoding = THREE.sRGBEncoding;
        return tex;
      }

      function createAcousticWallTexture() {
        const w = 512, h = 512;
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#111215';
        ctx.fillRect(0, 0, w, h);

        // Subtle vertical acoustic slat ribs
        for (let x = 0; x < w; x += 16) {
          ctx.fillStyle = '#0B0C0E';
          ctx.fillRect(x, 0, 2, h);
          ctx.fillStyle = 'rgba(255,255,255,0.015)';
          ctx.fillRect(x + 2, 0, 2, h);
        }
        // Subtle noise
        let seed = 4242;
        const rand = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
        for (let i = 0; i < 6500; i++) {
          const x = rand() * w, y = rand() * h;
          const a = rand() * 0.035;
          ctx.fillStyle = `rgba(255,255,255,${a.toFixed(3)})`;
          ctx.fillRect(x, y, 2, 2);
        }
        const tex = new THREE.CanvasTexture(c);
        tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(8, 2);
        tex.encoding = THREE.sRGBEncoding;
        return tex;
      }

      function createGlowTexture(innerColor, midColor) {
        const w = 128, h = 256;
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const ctx = c.getContext('2d');
        ctx.clearRect(0, 0, w, h);

        // Horizontal Gaussian glow + soft vertical fade at tips
        const img = ctx.createImageData(w, h);
        const d = img.data;
        for (let y = 0; y < h; y++) {
          const ny = (y / (h - 1)) * 2 - 1; // -1..1
          const vMask = Math.pow(Math.max(0, 1 - Math.pow(Math.abs(ny), 3.4)), 1.5);
          for (let x = 0; x < w; x++) {
            const nx = (x / (w - 1)) * 2 - 1;
            const hGlow = Math.exp(-nx * nx * 6.8);
            const hCore = Math.exp(-nx * nx * 38.0);
            const a = Math.min(1, (hGlow * 0.72 + hCore * 0.65) * vMask);
            const mix = Math.min(1, hCore * 1.4);
            const r = innerColor[0] * mix + midColor[0] * (1 - mix);
            const g = innerColor[1] * mix + midColor[1] * (1 - mix);
            const b = innerColor[2] * mix + midColor[2] * (1 - mix);
            const idx = (y * w + x) * 4;
            d[idx] = r;
            d[idx + 1] = g;
            d[idx + 2] = b;
            d[idx + 3] = Math.round(a * 255);
          }
        }
        ctx.putImageData(img, 0, 0);
        const tex = new THREE.CanvasTexture(c);
        tex.encoding = THREE.sRGBEncoding;
        return tex;
      }

      function createRadialSpotTexture(r, g, b) {
        const s = 128;
        const c = document.createElement('canvas');
        c.width = c.height = s;
        const ctx = c.getContext('2d');
        const grad = ctx.createRadialGradient(s/2, s/2, 1, s/2, s/2, s/2);
        grad.addColorStop(0.0, `rgba(${r},${g},${b},1.0)`);
        grad.addColorStop(0.18, `rgba(${r},${g},${b},0.65)`);
        grad.addColorStop(0.50, `rgba(${r},${g},${b},0.16)`);
        grad.addColorStop(1.0, `rgba(${r},${g},${b},0.0)`);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, s, s);
        const tex = new THREE.CanvasTexture(c);
        tex.encoding = THREE.sRGBEncoding;
        return tex;
      }

      /* ---------------------------------------------------------------------
         High-Resolution Procedural Movie Screen Artwork:
         "AVENGERS: DOOMSDAY"
         Deep emerald-green & obsidian faceted slanted metallic 'A' monolith,
         cold emerald light bleeding through precision armor seams,
         metallic italic silver-grey "AVENGERS" + bright wide-tracked "DOOMSDAY".
         --------------------------------------------------------------------- */
      function createAvengersDoomsdayScreenTexture() {
        const W = 2048, H = 870;
        const c = document.createElement('canvas');
        c.width = W; c.height = H;
        const ctx = c.getContext('2d');

        // 1. Deep cinematic dark-emerald atmosphere backdrop
        const bgGrad = ctx.createRadialGradient(W * 0.51, H * 0.48, 30, W * 0.50, H * 0.50, W * 0.62);
        bgGrad.addColorStop(0.00, '#0D3B24');
        bgGrad.addColorStop(0.28, '#072215');
        bgGrad.addColorStop(0.62, '#04100B');
        bgGrad.addColorStop(1.00, '#020404');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, W, H);

        // Volumetric diagonal cold-green light shafts behind the A monolith
        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        const shafts = [
          { x1: W * 0.42, y1: 0, x2: W * 0.24, y2: H, w: 280, a: 0.16 },
          { x1: W * 0.56, y1: 0, x2: W * 0.44, y2: H, w: 360, a: 0.22 },
          { x1: W * 0.68, y1: 0, x2: W * 0.58, y2: H, w: 210, a: 0.13 },
          { x1: W * 0.50, y1: H * 0.46, x2: W * 0.85, y2: H * 0.22, w: 180, a: 0.11 }
        ];
        for (const sh of shafts) {
          const g = ctx.createLinearGradient(sh.x1, sh.y1, sh.x2, sh.y2);
          g.addColorStop(0, `rgba(26, 232, 126, 0)`);
          g.addColorStop(0.45, `rgba(38, 255, 146, ${sh.a})`);
          g.addColorStop(1, `rgba(12, 130, 74, 0)`);
          ctx.strokeStyle = g;
          ctx.lineWidth = sh.w;
          ctx.beginPath();
          ctx.moveTo(sh.x1, sh.y1);
          ctx.lineTo(sh.x2, sh.y2);
          ctx.stroke();
        }

        // Intense cold-green core glow positioned directly behind the armor cracks
        const coreGlow1 = ctx.createRadialGradient(W * 0.505, H * 0.46, 12, W * 0.505, H * 0.46, 470);
        coreGlow1.addColorStop(0.0, 'rgba(130, 255, 190, 0.82)');
        coreGlow1.addColorStop(0.18, 'rgba(42, 245, 140, 0.52)');
        coreGlow1.addColorStop(0.50, 'rgba(12, 125, 68, 0.18)');
        coreGlow1.addColorStop(1.0, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = coreGlow1;
        ctx.fillRect(0, 0, W, H);

        // Secondary seam glow near the crossbar arrow
        const coreGlow2 = ctx.createRadialGradient(W * 0.56, H * 0.58, 8, W * 0.56, H * 0.58, 280);
        coreGlow2.addColorStop(0.0, 'rgba(160, 255, 205, 0.72)');
        coreGlow2.addColorStop(0.35, 'rgba(30, 235, 128, 0.30)');
        coreGlow2.addColorStop(1.0, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = coreGlow2;
        ctx.fillRect(0, 0, W, H);
        ctx.restore();

        // 2. Monumental Faceted Metallic Slanted "A" Structure
        // Constructed from sharp dark-emerald & black bevelled metallic armor plates
        // with narrow illuminated seams between plates!
        ctx.save();
        ctx.translate(W * 0.50, H * 0.50);

        // Helper to draw a metallic faceted polygon with brushed sheen + cold-green rim
        function drawFacet(pts, c1, c2, c3, rimColor, rimAlpha) {
          ctx.save();
          ctx.beginPath();
          ctx.moveTo(pts[0][0], pts[0][1]);
          for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
          ctx.closePath();
