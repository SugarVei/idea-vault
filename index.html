<body>
<div class="ambient" aria-hidden="true"><canvas id="particle-background"></canvas></div>

<div class="wrap">
  <span class="top-sentinel" id="topSentinel" aria-hidden="true"></span>
  <header class="top">
    <a class="brand" href="./" data-t="brand"></a>
    <div class="top-right">
      <div class="admin-bar" id="adminBar" hidden></div>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="zh">中</button>

  <section class="intro">
    <h1 id="title"></h1>
    <p class="lede" data-t="sub"></p>
  </section>

  <main>
    <div class="bar"><div class="chips glass" id="chips" role="group"></div></div>
    <span class="sr-only" id="count" aria-live="polite"></span>
    <div class="grid" id="grid" aria-busy="true"></div>
  </main>
</div>

<dialog class="sheet glass" id="sheet" aria-labelledby="sheet-title"></dialog>
<dialog class="sheet glass form-sheet" id="login" aria-labelledby="login-title"></dialog>
<dialog class="sheet glass form-sheet" id="editor" aria-labelledby="editor-title"></dialog>
