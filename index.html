<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sugar 的仓库 · SugarV</title>
  <meta name="description" content="SugarV 的交互作品、设计实验与开源收藏。">
  <meta name="theme-color" content="#ffffff">
  <meta property="og:title" content="Sugar 的仓库 · SugarV">
  <meta property="og:description" content="Interactive projects, design experiments, and open-source finds by SugarV.">
  <meta property="og:image" content="assets/harbor-1.jpg">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='1' y='1' width='22' height='22' rx='6' fill='%23191a1b'/%3E%3Cpath d='M6.8 6.8h4v4h-4zm6.4 0h4v4h-4zm-6.4 6.4h4v4h-4zm6.4 0h4v4h-4z' fill='white'/%3E%3C/svg%3E">
  <link rel="preload" href="assets/fonts/Geist-Latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css?v=sugar-vault-20-header">
  <link rel="stylesheet" href="theme-switch.css?v=1">
  <link rel="stylesheet" href="language-picker.css?v=2">
  <link rel="stylesheet" href="panorama.css?v=4">
  <link rel="stylesheet" href="arc-coverflow.css?v=3">
  <link rel="stylesheet" href="dissolve-carousel.css?v=3">
  <link rel="stylesheet" href="compact-gallery.css?v=2">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
  <script type="module" src="app.js?v=sugar-vault-35-dissolve-footer"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./">
      <svg width="25" height="25" viewBox="0 0 25 25" fill="none" aria-hidden="true">
        <rect x="1" y="1" width="23" height="23" rx="7" fill="currentColor"/>
        <path d="M7 7.2h4.2v4.2H7zm6.8 0H18v4.2h-4.2zM7 14h4.2v4.2H7zm6.8 0H18v4.2h-4.2z" fill="var(--bg)"/>
      </svg>
      <span>SugarV</span>
    </a>
    <form class="search" id="search-form" role="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" aria-hidden="true"><circle cx="10.75" cy="10.75" r="5.75"/><path d="m15 15 4.25 4.25" stroke-linecap="round"/></svg>
      <input id="search" type="search" aria-label="搜索作品" placeholder="搜索作品" autocomplete="off" spellcheck="false">
      <button type="button" class="icon-button search-clear" id="search-clear" aria-label="清空搜索" hidden>×</button>
      <kbd id="shortcut" aria-hidden="true">Ctrl K</kbd>
    </form>
    <div class="header-actions">
      <button type="button" class="icon-button" id="saved" aria-label="收藏作品" aria-pressed="false"></button>
      <button type="button" id="theme" role="switch" aria-checked="false" aria-label="深色模式"></button>
      <div class="language-picker">
        <button type="button" id="language" aria-haspopup="listbox" aria-expanded="false">简体中文</button>
      </div>
    </div>
  </header>

  <main>
    <section class="intro" aria-labelledby="title">
      <h1 id="title" data-t="title">Sugar 的仓库</h1>
    </section>

    <section class="wrap work-section" id="works" aria-label="作品">
      <div class="profile-actions">
        <a class="profile-link profile-rednote" href="https://www.xiaohongshu.com/user/profile/5f2ea8180000000001008b56" target="_blank" rel="noopener noreferrer">
          <svg aria-hidden="true" viewBox="0 0 24 24"><use href="assets/social-marks.svg#xiaohongshu"/></svg>
          <span class="visually-hidden" data-t="rednoteProfile">SugarV 的小红书主页（在新标签页打开）</span>
        </a>
        <a class="profile-link profile-github" href="https://github.com/SugarVei" target="_blank" rel="noopener noreferrer">
          <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11.5" fill="#fff"/><use href="assets/social-marks.svg#github"/></svg>
          <span class="visually-hidden" data-t="githubProfile">SugarV 的 GitHub 主页（在新标签页打开）</span>
        </a>
        <div class="admin-bar" id="adminBar" hidden></div>
      </div>
      <div class="gallery-toolbar">
        <div class="chips" id="chips" role="group" aria-label="作品分类"></div>
        <div class="gallery-view-tools">
          <p class="count" id="count" role="status"></p>
          <div class="view-switch" id="view-switch" role="group" aria-label="作品展示方式">
            <button type="button" class="view-switch-button" data-view-mode="grid" aria-pressed="true" aria-label="网格展示" title="网格展示" aria-controls="grid"><span aria-hidden="true"></span></button>
            <button type="button" class="view-switch-button" data-view-mode="panorama" aria-pressed="false" aria-label="全景展示" title="全景展示" aria-controls="panorama"><span aria-hidden="true"></span></button>
            <button type="button" class="view-switch-button" data-view-mode="arc" aria-pressed="false" aria-label="弧形展示" title="弧形展示" aria-controls="arc-coverflow"><span aria-hidden="true"></span></button>
            <button type="button" class="view-switch-button" data-view-mode="dissolve" aria-pressed="false" aria-label="粒子展示" title="粒子展示" aria-controls="dissolve-carousel"><span aria-hidden="true"></span></button>
            <button type="button" class="view-switch-button" data-view-mode="compact" aria-pressed="false" aria-label="小卡片展示" title="小卡片展示" aria-controls="compact-gallery"><span aria-hidden="true"><svg viewBox="0 0 16 16" fill="currentColor"><rect x="2" y="2" width="5" height="5" rx="1.1"/><rect x="9" y="2" width="5" height="5" rx="1.1"/><rect x="2" y="9" width="5" height="5" rx="1.1"/><rect x="9" y="9" width="5" height="5" rx="1.1"/></svg></span></button>
          </div>
        </div>
      </div>
      <div class="grid" id="grid" aria-busy="true"></div>
      <div id="panorama" hidden></div>
      <div id="arc-coverflow" hidden></div>
      <div id="dissolve-carousel" hidden></div>
      <div id="compact-gallery" hidden></div>
      <div class="empty-results" id="empty-results" hidden>
        <p id="empty-message"></p>
        <button class="pill" id="reset-filters" type="button" data-t="showAll">查看全部作品</button>
      </div>
    </section>
  </main>

  <footer class="wrap site-footer">SugarV</footer>

  <dialog class="sheet glass" id="sheet" aria-labelledby="sheet-title"></dialog>
  <dialog class="sheet glass" id="tutorial" aria-labelledby="tutorial-title"></dialog>
  <dialog class="sheet glass form-sheet" id="memory-access" aria-labelledby="memory-access-title" aria-describedby="memory-access-hint"></dialog>
  <dialog class="sheet glass form-sheet" id="login" aria-labelledby="login-title"></dialog>
  <dialog class="sheet glass form-sheet" id="editor" aria-labelledby="editor-title"></dialog>
  <div class="toast glass" id="toast" role="status" hidden></div>
</body>
</html>
