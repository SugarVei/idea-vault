<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GPT-UI设计画廊</title><link rel="stylesheet" href="../particle-background.css?v=20261109-particle-field-bright">
<script type="module" src="../background-controls.js?v=20261109-particle-field-bright"></script>
<style>
:root{--particle-ink:#637166;--particle-opacity:.32;--bg:#f5f4f0;--ink:#242622;--muted:#777a71;--line:#dcded5;--green:#44614b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:4px}a{color:inherit}header{padding:25px 4vw;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.brand{font-size:18px;letter-spacing:-.8px;font-weight:650}.brand span{font-weight:400;color:#999;margin-left:14px;font-size:13px;letter-spacing:.1px}.actions{display:flex;gap:12px;align-items:center}.quiet{border:0;background:none;padding:10px;color:var(--muted)}.primary{border:0;background:var(--ink);color:white;padding:13px 21px;border-radius:30px}.primary:hover{background:var(--green)}main{padding:55px 4vw 40px;max-width:1680px;margin:auto}.hero{display:flex;justify-content:space-between;align-items:end;margin-bottom:55px}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--muted)}h1{font-size:clamp(38px,5.4vw,77px);font-weight:450;letter-spacing:-3px;line-height:1.12;margin:18px 0 20px}h1 em{font-family:Georgia,serif;font-weight:400;color:var(--green)}.intro{line-height:1.9;color:var(--muted);margin:0;font-size:14px}.note{max-width:205px;border-left:1px solid var(--line);padding-left:25px;line-height:1.9;color:var(--muted);font-size:12px}.tools{display:flex;justify-content:space-between;gap:15px;margin-bottom:28px;flex-wrap:wrap}.tabs{display:flex;gap:5px;flex-wrap:wrap}.tab{background:none;border:0;border-radius:24px;padding:10px 16px;color:var(--muted)}.tab.active{background:#e3e7dc;color:#344a34}.search{border:1px solid var(--line);border-radius:24px;padding:10px 17px;background:transparent;width:230px}.count{font-size:11px;color:var(--muted);margin:0 0 18px;letter-spacing:1px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:36px 24px}.card{min-width:0}.cover{height:235px;border-radius:8px;position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;text-decoration:none;overflow:hidden;transition:transform .2s;background:var(--tile);color:var(--type)}.cover:hover{transform:translateY(-4px)}.cover .word{font-family:Georgia,serif;font-size:clamp(32px,3.6vw,55px);line-height:1.15;letter-spacing:-2px;text-align:center;max-width:85%;transition:transform .3s}.cover:hover .word{transform:scale(1.04)}.cover .small{margin-top:16px;letter-spacing:3px;font-size:9px;text-transform:uppercase;opacity:.65}.cover .caption{position:absolute;bottom:16px;left:18px;font-size:10px;opacity:.55;letter-spacing:1px}.arrow{position:absolute;right:17px;bottom:13px;font-size:24px;font-weight:200}.cover img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}.save{position:absolute;top:12px;right:12px;border:0;width:31px;height:31px;background:#ffffffb8;border-radius:50%;color:#333;z-index:2}.save.saved{background:#344c39;color:white}.cover-wrap{position:relative}.title-row{display:flex;justify-content:space-between;align-items:center;margin-top:17px;gap:10px}.title-row h2{font-size:16px;font-weight:550;margin:0}.category{font-size:10px;color:var(--muted);white-space:nowrap}.desc{font-size:12px;line-height:1.8;color:var(--muted);margin:9px 0;min-height:43px}.card-foot{display:flex;align-items:center;justify-content:space-between;font-size:10px;color:var(--muted)}.card-foot button{border:0;background:none;color:var(--muted);padding:4px 0}.empty{grid-column:1/-1;padding:70px;text-align:center;color:var(--muted)}footer{margin-top:55px;border-top:1px solid var(--line);padding-top:20px;display:flex;justify-content:space-between;color:var(--muted);font-size:11px;gap:20px;line-height:1.8}dialog{border:1px solid var(--line);border-radius:16px;background:var(--bg);width:500px;max-width:92vw;padding:30px}dialog::backdrop{background:#1116;backdrop-filter:blur(5px)}dialog h2{font-weight:450;margin-top:0}label{display:block;font-size:12px;color:var(--muted);margin:17px 0 6px}dialog input,dialog select,dialog textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:5px;background:white;color:var(--ink)}dialog textarea{height:80px;resize:vertical}.modal-actions{display:flex;justify-content:end;gap:10px;margin-top:24px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);padding:12px 20px;background:var(--ink);color:white;border-radius:24px;z-index:10;font-size:12px}.hidden{display:none}#import{display:none}@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.note{display:none}.cover{height:220px}h1{letter-spacing:-2px}}@media(max-width:580px){header{padding:18px 5vw}.brand span{display:none}main{padding:34px 5vw}.hero{margin-bottom:30px}h1{font-size:43px}.grid{grid-template-columns:1fr;gap:28px}.cover{height:240px}.search{width:100%}.tab{padding:9px 12px}.actions{gap:2px}.actions .quiet{font-size:11px;padding:8px}.primary{padding:11px 15px}.intro{font-size:12px}.hero br{display:none}footer{flex-direction:column}.desc{min-height:0}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="ambient" aria-hidden="true"><canvas id="particle-background"></canvas></div>
<header><div class="brand"><a href="../" style="text-decoration:none" aria-label="返回作品集">SugarV</a><span> / GPT-UI设计画廊</span></div><div class="actions"><button class="quiet" id="export">导出</button><button class="quiet" id="importButton">导入</button><button class="primary" id="add">＋ 收集灵感</button><input id="import" type="file" accept="application/json"></div></header><main><section class="hero"><div><div class="eyebrow">UI INSPIRATION GALLERY · EST. 2026</div><h1>少一点，<br>让设计<em>多一点。</em></h1><p class="intro">收集让人停留的网站、恰到好处的交互，以及值得反复看的 UI。<br>不只是保存链接，更是慢慢建立自己的审美。</p></div><div class="note">留白 / 排版 / 秩序<br>自然、克制的交互<br>简约，但不无聊。</div></section><section class="tools"><div class="tabs" id="tabs"></div><input id="search" class="search" placeholder="搜索名称、灵感、关键词…" aria-label="搜索灵感"></section><p class="count" id="count"></p><div class="grid" id="grid"></div><footer><span>SugarV / 一个慢慢生长的灵感空间</span><span>封面为索引设计，并非原站截图。点击卡片查看原作。<br>每位访客的新增、收藏与笔记仅保存在自己的浏览器，不会公开或同步。换设备前请导出备份。</span></footer></main><dialog id="dialog"><form id="form"><h2 id="modalTitle">收集一个好设计</h2><input type="hidden" id="editId"><label for="name">名称</label><input id="name" required maxlength="80" placeholder="这个案例叫什么？"><label for="url">原站链接</label><input id="url" type="url" required placeholder="https://"><label for="category">分类</label><select id="category"><option>简约网站</option><option>交互细节</option><option>产品 UI</option><option>灵感入口</option></select><label for="description">为什么喜欢 / 想借鉴什么</label><textarea id="description" maxlength="500" placeholder="比如：大留白、清晰的字体层级、自然的悬停反馈…"></textarea><label for="image">预览图链接（可选）</label><input id="image" type="url" placeholder="你有权使用的图片 URL"><div class="modal-actions"><button type="button" class="quiet" id="cancel">取消</button><button type="submit" class="primary">保存灵感</button></div></form></dialog><div id="toast" class="toast hidden" role="status"></div><script>
const seeds=[
{id:'rauno',name:'Rauno · Craft',word:'Craft.',category:'交互细节',url:'https://rauno.me/craft',description:'从 Toolbar Morph、Spatial Tooltip 等作品，观察状态切换如何保持空间连续性。适合你的交互动效实验。',small:'details make the difference',color:'#e4e8de',type:'#344333'},
{id:'linear',name:'Linear · UI 重设计',word:'Less noise.\nMore clarity.',category:'产品 UI',url:'https://linear.app/now/how-we-redesigned-the-linear-ui',description:'官方设计复盘：侧栏、标签、面板如何减少视觉噪声，同时保持信息密度和清晰层级。',small:'product interface / case study',color:'#e0e2e8',type:'#343a4e'},
{id:'vercel',name:'Vercel · What will you ship?',word:'Form follows\nfunction.',category:'简约网站',url:'https://rauno.me/craft/vercel',description:'设计者对 Vercel 网站的复盘：瑞士排版、网格、模块与速度。可借鉴秩序感，不照搬装饰。',small:'grid / type / restraint',color:'#e9e7e1',type:'#3c3b36'},
{id:'invisible',name:'Invisible Details',word:'Feel the\ndifference.',category:'交互细节',url:'https://rauno.me/craft/interaction-design',description:'从隐喻、反馈和操作频率理解交互细节。不是让每个元素都动，而是让动作回应用户意图。',small:'the invisible details',color:'#e6dfd9',type:'#6c5146'},
{id:'minimal',name:'Minimal Gallery',word:'Minimal\nGallery',category:'灵感入口',url:'https://minimal.gallery/',description:'寻找简约网站的入口。优先观察首屏留白、字体比例和信息取舍，再收藏真正适合自己的案例。',small:'a quieter direction',color:'#dfdfd7',type:'#3d4538'},
{id:'siteinspire',name:'Siteinspire',word:'Space.\nType. Order.',category:'灵感入口',url:'https://www.siteinspire.com/',description:'按风格、类型和主题浏览网站参考。适合找 Editorial、Minimal、Typographic 方向。',small:'editorial / minimal / typography',color:'#e9e2cf',type:'#61533a'},
{id:'spells',name:'Design Spells',word:'Small details,\nreal delight.',category:'交互细节',url:'https://www.designspells.com/',description:'微交互与界面细节收集。把喜欢的效果拆成触发动作、过渡状态、反馈结果三部分记录。',small:'micro-interaction inspiration',color:'#dedde8',type:'#514868'},
{id:'60fps',name:'60fps',word:'Move with\npurpose.',category:'交互细节',url:'https://60fps.design/',description:'浏览 Web、iOS、Android 的动效与交互参考。更适合看真实流程，而不只看静态好看的画面。',small:'motion / flow / feedback',color:'#dce6e4',type:'#35564f'},
{id:'guidelines',name:'Web Interface Guidelines',word:'Care is\nin the details.',category:'产品 UI',url:'https://interfaces.rauno.me/',description:'界面工程细节清单：交互、动效和可访问性。把审美判断转成开发时能检查的具体事项。',small:'a practical interface checklist',color:'#e8e3dc',type:'#534b43'}
];
const key='sugarv-ui-gallery-v1';let state={items:seeds,favorites:[]};try{const saved=JSON.parse(localStorage.getItem(key));if(saved&&Array.isArray(saved.items)&&Array.isArray(saved.favorites))state=saved}catch{}let filter='全部',query='';const $=s=>document.querySelector(s);const safeUrl=u=>{try{const x=new URL(u);return ['https:','http:'].includes(x.protocol)?x.href:''}catch{return ''}};function persist(){try{localStorage.setItem(key,JSON.stringify(state));return true}catch{toast('保存失败，请先导出备份');return false}}function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');setTimeout(()=>$('#toast').classList.add('hidden'),2600)}
function render(){const tabs=['全部','简约网站','交互细节','产品 UI','灵感入口','我的收藏'];$('#tabs').replaceChildren(...tabs.map(t=>{let b=document.createElement('button');b.className='tab'+(filter===t?' active':'');b.textContent=t;b.onclick=()=>{filter=t;render()};return b}));const list=state.items.filter(x=>(filter==='全部'||filter==='我的收藏'&&state.favorites.includes(x.id)||x.category===filter)&&[x.name,x.description,x.category].join(' ').toLowerCase().includes(query));$('#count').textContent=String(list.length).padStart(2,'0')+' ITEMS / '+(filter==='全部'?'精选与个人收集':filter);$('#grid').replaceChildren();for(const x of list){const c=document.createElement('article');c.className='card';const wrap=document.createElement('div');wrap.className='cover-wrap';const a=document.createElement('a');a.className='cover';a.href=safeUrl(x.url)||'#';a.target='_blank';a.rel='noopener noreferrer';a.style.setProperty('--tile',x.color||'#e4e8de');a.style.setProperty('--type',x.type||'#344333');a.setAttribute('aria-label','打开 '+x.name);const w=document.createElement('span');w.className='word';w.textContent=x.word||x.name;w.style.whiteSpace='pre-line';const sm=document.createElement('span');sm.className='small';sm.textContent=x.small||'personal collection';a.append(w,sm);if(safeUrl(x.image)){let im=document.createElement('img');im.src=x.image;im.alt=x.name+' 预览';im.loading='lazy';im.onerror=()=>im.remove();a.append(im)}const cap=document.createElement('span');cap.className='caption';cap.textContent=x.image?'预览图':'INDEX COVER';const ar=document.createElement('span');ar.className='arrow';ar.textContent='↗';a.append(cap,ar);const b=document.createElement('button');b.className='save'+(state.favorites.includes(x.id)?' saved':'');b.textContent=state.favorites.includes(x.id)?'★':'☆';b.setAttribute('aria-label','收藏 '+x.name);b.onclick=()=>{state.favorites=state.favorites.includes(x.id)?state.favorites.filter(v=>v!==x.id):[...state.favorites,x.id];persist();render()};wrap.append(a,b);const row=document.createElement('div');row.className='title-row';const h=document.createElement('h2');h.textContent=x.name;const tag=document.createElement('span');tag.className='category';tag.textContent=x.category;row.append(h,tag);const desc=document.createElement('p');desc.className='desc';desc.textContent=x.description;const foot=document.createElement('div');foot.className='card-foot';const domain=document.createElement('span');try{domain.textContent=new URL(x.url).hostname.replace(/^www\./,'')}catch{domain.textContent='链接待检查'}const edit=document.createElement('button');edit.textContent='编辑笔记 ↗';edit.onclick=()=>openForm(x);foot.append(domain,edit);c.append(wrap,row,desc,foot);$('#grid').append(c)}if(!list.length){const e=document.createElement('p');e.className='empty';e.textContent='这里还很安静。换个关键词，或收集你的第一个灵感。';$('#grid').append(e)}}
function openForm(x){$('#form').reset();$('#editId').value=x?.id||'';$('#modalTitle').textContent=x?'编辑灵感':'收集一个好设计';for(const f of ['name','url','category','description','image'])if(x?.[f])$('#'+f).value=x[f];$('#dialog').showModal()}
$('#add').onclick=()=>openForm();$('#cancel').onclick=()=>$('#dialog').close();$('#search').oninput=e=>{query=e.target.value.toLowerCase().trim();render()};$('#form').onsubmit=e=>{e.preventDefault();const id=$('#editId').value;const item=state.items.find(x=>x.id===id)||{id:crypto.randomUUID()};if(!safeUrl($('#url').value)||($('#image').value&&!safeUrl($('#image').value))){toast('请使用 http 或 https 链接');return}for(const f of ['name','url','category','description','image'])item[f]=$('#'+f).value.trim();if(!id)state.items.unshift(item);persist();$('#dialog').close();filter='全部';render();toast('已保存到此浏览器')};$('#export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='SugarV-UI-灵感备份.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('已导出收藏与笔记')};$('#importButton').onclick=()=>$('#import').click();$('#import').onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text());if(!Array.isArray(data.items)||!Array.isArray(data.favorites)||data.items.length>5000||data.items.some(x=>typeof x.id!=='string'||typeof x.name!=='string'||!safeUrl(x.url)))throw Error();let existing=new Set(state.items.map(x=>x.id));state.items.push(...data.items.filter(x=>!existing.has(x.id)));state.favorites=[...new Set([...state.favorites,...data.favorites.filter(x=>typeof x==='string')])];persist();render();toast('已合并导入，保留现有笔记')}catch{toast('无法导入，请选择有效的画廊备份 JSON')}e.target.value=''};render();
</script></body></html>
