<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#08090d"><title>PUNCH DRIVE 重拳飞车 · 竞速 乱斗 生存</title><style>/* PUNCH DRIVE · 简约中文界面
   一种无衬线中文字体 + 一种数字字体；圆角半透明面板；每个模式只用一个强调色。 */
:root{
  --cn:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei UI","Microsoft YaHei","Noto Sans SC","Source Han Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
  --num:"Bahnschrift","DIN Alternate","Segoe UI","PingFang SC","Microsoft YaHei UI",sans-serif;
  --bg:#08090d;
  --panel:rgba(16,18,24,.62);--panel-hi:rgba(30,33,42,.78);--solid:rgba(15,17,22,.9);
  --line:rgba(255,255,255,.08);--line-hi:rgba(255,255,255,.18);
  --text:#f3f4f6;--sub:#b3b7c1;--dim:#7b808b;
  --good:#5ad18b;--gold:#f5c451;--bad:#ff5d62;--nitro:#4aa8ff;
  --mode-accent:#38d9f5;
  --r:12px;--blur:blur(12px) saturate(1.15);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--cn);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
#game-canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block;outline:none}
#game-ui{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden}
#game-ui button,#game-ui label,#game-ui input{pointer-events:auto}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--mode-accent);outline-offset:2px}
kbd{font-family:var(--num);font-weight:600;font-size:11px;line-height:1;padding:3px 6px;border-radius:5px;border:1px solid var(--line-hi);background:rgba(255,255,255,.07);color:var(--text);white-space:nowrap}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
/* 比赛中的面板不做背景模糊：画面每帧都在动，模糊很耗显卡。 */
#game-ui .hud .panel{background:rgba(14,16,21,.72);backdrop-filter:none;-webkit-backdrop-filter:none}
[hidden]{display:none!important}

/* ------------------------------------------------------------ 通用控件 */
.primary{font-weight:700;font-size:16px;letter-spacing:.08em;color:#0b0c10;background:var(--mode-accent);padding:12px 32px;border-radius:999px;transition:transform .15s,filter .15s}
.primary:hover{filter:brightness(1.08);transform:translateY(-1px)}
.secondary{font-weight:500;font-size:15px;letter-spacing:.04em;padding:11px 24px;border-radius:999px;border:1px solid var(--line-hi);background:rgba(255,255,255,.05);transition:background .15s,border-color .15s}
.secondary:hover{background:rgba(255,255,255,.11);border-color:rgba(255,255,255,.32)}
.seg{display:inline-flex;align-items:center;gap:4px;flex-wrap:wrap}
.seg b{font-size:12.5px;font-weight:500;color:var(--sub);margin-right:8px}
.seg button{font-size:13px;font-weight:500;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--sub);transition:color .15s,background .15s,border-color .15s}
.seg button:hover{color:var(--text);border-color:var(--line-hi)}
.seg button.on{background:rgba(255,255,255,.92);border-color:transparent;color:#0b0c10;font-weight:600}
.toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.toggle input{display:none}
.toggle i{width:34px;height:20px;border-radius:10px;background:rgba(255,255,255,.16);position:relative;transition:background .2s}
.toggle i::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .2s}
.toggle input:checked+i{background:var(--good)}
.toggle input:checked+i::after{transform:translateX(14px)}
.toggle b{font-size:12.5px;font-weight:500;color:var(--sub)}

/* ------------------------------------------------------------ 主菜单 */
.screen{position:absolute;inset:0}
.menu-screen{display:grid;grid-template-columns:minmax(360px,42%) 1fr;grid-template-rows:1fr auto auto;padding:6vh 4.4vw 3.2vh;gap:2.6vh 3vw;pointer-events:auto;
  background:linear-gradient(90deg,rgba(8,9,13,.8) 0%,rgba(8,9,13,.4) 32%,rgba(8,9,13,0) 58%),linear-gradient(0deg,rgba(8,9,13,.92) 0%,rgba(8,9,13,.5) 30%,rgba(8,9,13,0) 52%)}
.brand{align-self:center}
.eyebrow-cn{display:flex;align-items:center;gap:12px;margin:0 0 16px;font-size:15px;font-weight:600;letter-spacing:.36em;color:var(--sub)}
.eyebrow-cn::before{content:"";width:24px;height:2px;border-radius:2px;background:var(--mode-accent)}
.logo{margin:0;font-family:var(--num);font-weight:700;font-size:clamp(60px,7.4vw,124px);line-height:.92;letter-spacing:.01em;color:#fff}
.slogan{margin:20px 0 10px;font-size:17px;font-weight:500;letter-spacing:.5em;color:var(--text)}
.blurb{margin:0;max-width:420px;font-size:14px;line-height:1.85;color:var(--sub)}
.mode-grid{grid-column:1/-1;display:grid;grid-template-columns:1.25fr repeat(4,1fr);gap:12px}
.mode-card{--accent:var(--mode-accent);position:relative;text-align:left;min-height:196px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:16px;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);transition:transform .2s ease,background .2s,border-color .2s}
.mode-card::before{content:"";position:absolute;left:18px;right:18px;top:-1px;height:2px;border-radius:0 0 2px 2px;background:var(--accent)}
.mode-card .icon{width:32px;height:32px;color:var(--accent)}
.mode-card .icon svg{width:100%;height:100%}
.mode-card .names{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:4px}
.mode-card strong{font-size:21px;font-weight:700;letter-spacing:.06em}
.mode-card em{font-style:normal;font-family:var(--num);font-size:11px;letter-spacing:.14em;color:var(--dim)}
.mode-card p{margin:0;font-size:13px;line-height:1.65;color:var(--sub)}
.mode-card .chips{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap;padding-top:6px}
.mode-card .chips b{font-size:11.5px;font-weight:500;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.07);color:var(--sub)}
.mode-card .chips b.hot{background:var(--accent);color:#0b0c10;font-weight:600}
.mode-card:hover,.mode-card:focus-visible{transform:translateY(-4px);background:var(--panel-hi);border-color:color-mix(in srgb,var(--accent) 55%,transparent);outline:none}
.mode-card.featured strong{font-size:25px}
.menu-foot{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:20px;font-size:12.5px;color:var(--sub);flex-wrap:wrap}
.menu-foot .hint{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.menu-foot .hint kbd{margin-left:10px}.menu-foot .hint kbd:first-child{margin-left:0}
.quick-settings{display:flex;align-items:center;gap:18px}

/* ------------------------------------------------------------ 选择场地与赛车 */
.setup-screen{display:flex;flex-direction:column;padding:4.4vh 4.4vw 3.4vh;pointer-events:auto;background:linear-gradient(90deg,rgba(8,9,13,.9) 0%,rgba(8,9,13,.6) 36%,rgba(8,9,13,0) 60%),linear-gradient(0deg,rgba(8,9,13,.8) 0%,rgba(8,9,13,0) 24%)}
#game-ui[data-step="car"] .setup-screen{background:linear-gradient(90deg,rgba(8,9,13,.88) 0%,rgba(8,9,13,.5) 34%,rgba(8,9,13,0) 52%)}
.setup-head{display:flex;align-items:center;gap:20px}
.back-btn{font-size:14px;font-weight:500;padding:7px 16px 7px 12px;border-radius:999px;border:1px solid var(--line-hi);background:rgba(255,255,255,.04);color:var(--sub);transition:color .15s,background .15s}
.back-btn:hover{color:var(--text);background:rgba(255,255,255,.1)}
.crumbs{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--dim)}
.crumbs .crumb-mode{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700;color:var(--text);letter-spacing:.04em}
.crumbs .crumb-mode::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--mode-accent)}
.crumbs [data-step]::before{content:"/";margin-right:12px;color:#4a4e58}
.crumbs [data-step].on{color:var(--text);font-weight:600}
.step{flex:1;min-height:0;width:min(600px,44vw);display:flex;flex-direction:column;gap:14px;margin-top:3.4vh;overflow:auto;padding-right:6px}
.step h2{margin:0;font-size:30px;font-weight:700;letter-spacing:.08em}
.venue-list{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.venue-card{--accent:var(--mode-accent);position:relative;text-align:left;padding:14px 16px 13px 18px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;gap:4px;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);transition:background .15s,border-color .15s}
.venue-card::before{content:"";position:absolute;left:-1px;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.venue-card strong{font-size:18px;font-weight:700;letter-spacing:.06em}
.venue-card p{margin:0;font-size:12.5px;line-height:1.55;color:var(--sub)}
.venue-card small{font-size:11.5px;color:var(--dim)}
.venue-card:hover{background:var(--panel-hi)}
.venue-card.on{background:color-mix(in srgb,var(--accent) 14%,var(--solid));border-color:color-mix(in srgb,var(--accent) 70%,transparent)}
.option-rows{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.option-rows .seg b{min-width:70px}
.class-list{display:flex;flex-direction:column;gap:10px}
.class-card{text-align:left;padding:14px 18px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);display:grid;grid-template-columns:120px 1fr;column-gap:16px;row-gap:8px;align-items:center;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);transition:background .15s,border-color .15s}
.cls-name{grid-row:span 2;display:flex;flex-direction:column;gap:3px}
.class-card strong{font-size:26px;font-weight:700;letter-spacing:.1em}
.class-card em{font-style:normal;font-family:var(--num);font-size:11px;letter-spacing:.16em;color:var(--dim)}
.class-card p{margin:0;font-size:12.5px;line-height:1.5;color:var(--sub)}
.class-card dl{margin:0;display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.class-card dl div{display:flex;flex-direction:column;gap:5px}
.class-card dt{font-size:11.5px;color:var(--dim)}
.class-card dd{margin:0;display:flex;gap:3px}
.class-card dd i{flex:1;max-width:12px;height:4px;border-radius:2px;background:rgba(255,255,255,.12)}
.class-card dd i.on{background:var(--mode-accent)}
.class-card:hover{background:var(--panel-hi)}
.class-card.on{background:color-mix(in srgb,var(--mode-accent) 14%,var(--solid));border-color:color-mix(in srgb,var(--mode-accent) 70%,transparent)}
.paints{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:2px}
.paints>b{font-size:12.5px;font-weight:500;color:var(--sub);margin-right:2px}
.swatch{display:flex;flex-direction:column;align-items:center;gap:6px}
.swatch i{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--body) 0 56%,var(--stripe) 56% 70%,var(--body) 70%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2);transition:transform .15s}
.swatch span{font-size:11px;color:var(--dim)}
.swatch:hover i{transform:translateY(-2px)}
.swatch.on i{outline:2px solid #fff;outline-offset:3px}
.swatch.on span{color:var(--text)}
.garage-hint{margin:2px 0 0;font-size:12px;color:var(--dim)}
.setup-foot{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-top:14px;flex-wrap:wrap}
.setup-summary{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--sub);flex-wrap:wrap}
.setup-summary i{width:8px;height:8px;border-radius:50%}
.setup-summary b{font-size:16px;font-weight:700;color:var(--text)}
.setup-summary span::before{content:"·";margin-right:10px;color:var(--dim)}

/* ------------------------------------------------------------ 比赛 HUD */
.hud{position:absolute;inset:0;display:none}
#game-ui[data-screen="playing"] .hud,#game-ui[data-screen="paused"] .hud{display:block}
#game-ui[data-screen="paused"] .hud{opacity:.25}
#game-ui[data-screen="paused"] .name-labels,#game-ui[data-screen="paused"] #offscreen{visibility:hidden}
.race-only{display:none!important}
#game-ui[data-mode="race"] #race-pos,#game-ui[data-mode="race"] #item-slot{display:flex!important}
#game-ui[data-mode="race"] #minimap{display:block!important}
#game-ui[data-mode="race"] #controls-hint .race-only,#game-ui[data-mode="race"] .t-item{display:inline-flex!important}
.hud-tl{position:absolute;left:18px;top:16px;display:flex;flex-direction:column;gap:8px;width:240px}
#race-pos{align-items:baseline;gap:8px;padding:0 4px;text-shadow:0 2px 12px rgba(0,0,0,.45)}
#race-pos small{font-size:13px;font-weight:500;color:var(--sub)}
#race-pos b{font-family:var(--num);font-weight:700;font-size:62px;line-height:.9}
#race-pos span{font-family:var(--num);font-size:20px;color:var(--sub)}
#race-pos[data-place="1"] b{color:var(--gold)}
#board{padding:10px 10px 8px}
#board h3{margin:0 4px 6px;font-size:12px;font-weight:500;color:var(--sub);letter-spacing:.06em}
#board ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
#board li,.final li,.tour-table li{position:relative;display:grid;grid-template-columns:16px 3px 1fr auto;gap:8px;align-items:center;font-size:14px;padding:4px 6px;border-radius:7px}
#board li .pos,.final .pos,.tour-table .pos{font-family:var(--num);color:var(--dim);font-size:12px;text-align:right}
#board li i,.final li i,.tour-table li i{width:3px;height:14px;border-radius:2px}
#board li b,.final li b,.tour-table li b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#board li .val{font-family:var(--num);font-size:14px;color:var(--text);font-variant-numeric:tabular-nums}
#board li.me{background:color-mix(in srgb,var(--mode-accent) 22%,transparent)}
#board li.me b{font-weight:700}
#board li.out{opacity:.35}
#board li.crowned b::after{content:" ♛";color:var(--gold)}
#board li u{position:absolute;left:33px;right:6px;bottom:1px;height:2px;border-radius:1px;background:rgba(255,255,255,.08)}
#board li u::after{content:"";position:absolute;left:0;top:0;bottom:0;width:calc(var(--p)*100%);border-radius:1px;background:var(--gold)}
#clock{position:absolute;left:50%;top:14px;transform:translateX(-50%);min-width:210px;padding:8px 20px 9px;text-align:center}
#clock .big{font-family:var(--num);font-weight:600;font-size:34px;line-height:1.05;font-variant-numeric:tabular-nums}
#clock .lines{display:flex;justify-content:center;gap:14px;font-size:13px;margin-top:3px;color:var(--sub)}
#clock .lines i{font-style:normal;color:var(--dim)}
#clock .lines b{color:var(--gold);font-weight:600}
#clock .tag{font-size:12px;font-weight:500;color:var(--mode-accent);margin-top:3px}
#clock .tag:empty{display:none}
#clock.warn .big{color:var(--bad);animation:pulse .6s infinite alternate}
#clock.hot .tag{color:var(--bad)}
@keyframes pulse{to{opacity:.55}}
#minimap{position:absolute;right:16px;top:64px;width:188px;height:188px;padding:6px;border-radius:16px;background:rgba(14,16,21,.5)}
.feed{position:absolute;right:16px;top:64px;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#game-ui[data-mode="race"] .feed{top:264px}
.feed-entry{font-size:13px;font-weight:500;padding:6px 13px;border-radius:999px;background:var(--solid);border:1px solid var(--line);animation:slideIn .25s ease-out;transition:opacity .45s,transform .45s}
.feed-entry.leaving{opacity:0;transform:translateX(12px)}
@keyframes slideIn{from{opacity:0;transform:translateX(16px)}}
.hud-bc{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:10px;align-items:stretch}
#punch-btn{width:250px;padding:10px 16px 12px;text-align:left;pointer-events:auto}
.punch-top{display:flex;align-items:center;gap:8px}
.punch-top strong{font-size:16px;font-weight:700;letter-spacing:.1em}
.punch-top em{margin-left:auto;font-style:normal;font-size:13px;font-weight:600;color:var(--good)}
#punch-btn.charging em{color:var(--dim);font-family:var(--num)}
#punch-btn .meter{display:block;height:4px;margin-top:9px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden}
#punch-btn .meter i{display:block;height:100%;border-radius:2px;background:var(--sub);transform-origin:left;transition:transform .06s linear}
#punch-btn:not(.charging) .meter i{background:var(--good)}
#item-slot{--item:#5c6375;width:190px;padding:10px 14px 10px 16px;flex-direction:column;justify-content:center;gap:3px;position:relative;pointer-events:auto}
#item-slot::before{content:"";position:absolute;left:-1px;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--item)}
#item-slot .item-key{position:absolute;right:10px;top:10px;font-family:var(--num);font-size:11px;line-height:1;padding:3px 6px;border-radius:5px;border:1px solid var(--line-hi);color:var(--sub)}
#item-slot b{font-size:16px;font-weight:700;color:var(--dim)}
#item-slot small{font-size:11.5px;color:var(--dim)}
#game-ui .hud #item-slot.has{background:color-mix(in srgb,var(--item) 20%,rgba(14,16,21,.82));animation:itemPop .35s ease-out}
#item-slot.has b{color:var(--text)}
#item-slot.has small{color:var(--sub)}
@keyframes itemPop{from{transform:scale(1.06)}}
#speedo{position:absolute;right:16px;bottom:16px;width:236px;padding:12px 16px 13px;overflow:visible}
#speedo .speed{display:flex;align-items:baseline;gap:6px}
#speedo .speed b{font-family:var(--num);font-size:44px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;transition:color .2s}
#speedo .speed small{font-family:var(--num);font-size:12px;color:var(--dim)}
#speedo .speed-bar{height:3px;margin-top:8px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden}
#speedo .speed-bar i{display:block;height:100%;background:var(--sub);transform-origin:left;transform:scaleX(0);transition:transform .08s linear}
/* 氮气：漂移积攒 → 满格变成一罐 → 空格释放 */
#speedo .nitro{margin-top:11px;padding-top:10px;border-top:1px solid var(--line);pointer-events:auto;cursor:pointer}
.nitro-head{display:flex;align-items:center;gap:8px}
.nitro-label{font-size:13px;font-weight:700;letter-spacing:.12em;color:var(--sub);transition:color .2s}
.tanks{display:flex;gap:4px}
.tanks i{width:16px;height:8px;border-radius:3px;background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);transition:background .2s}
.tanks i.full{background:var(--nitro);box-shadow:none}
.nitro-head kbd{margin-left:auto}
.nitro-bar{height:6px;margin-top:8px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.nitro-bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#3c78ff,var(--nitro) 60%,#8fd2ff);transform-origin:left;transform:scaleX(0);transition:transform .1s linear}
.nitro-hint{margin-top:7px;font-size:12px;color:var(--dim);white-space:nowrap;transition:color .2s}
#speedo.drifting .nitro-label,#speedo.drifting .nitro-hint{color:#8cc6ff}
#speedo.nitro-ready .nitro-label{color:var(--nitro)}
#speedo.nitro-ready .nitro-hint{color:var(--text)}
#game-ui .hud #speedo.nitro-on{border-color:color-mix(in srgb,var(--nitro) 65%,transparent)}
#speedo.nitro-on .speed b,#speedo.nitro-on .nitro-label{color:#9bd0ff}
#speedo.nitro-on .nitro-hint{color:#9bd0ff;font-weight:600}
#speedo.nitro-on .nitro-bar i{background:linear-gradient(90deg,#8fd2ff,#fff)}
#speedo.flash .tanks i.full{animation:tankPop .5s ease-out}
@keyframes tankPop{0%{transform:scale(1.6)}100%{transform:scale(1)}}
#speedo .effect{position:absolute;right:14px;top:-26px;font-size:13px;font-weight:600;color:var(--mode-accent);text-shadow:0 1px 8px rgba(0,0,0,.65)}
#speedo .effect[data-type="power"]{color:var(--gold)}#speedo .effect[data-type="shield"]{color:var(--good)}
#countdown{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) scale(.6);font-family:var(--num);font-weight:600;font-size:min(26vh,200px);line-height:1;opacity:0;color:#fff;text-shadow:0 4px 30px rgba(0,0,0,.35)}
#countdown.show{animation:count .85s cubic-bezier(.2,1.2,.4,1) forwards}
#countdown.go{font-family:var(--cn);font-weight:800;font-size:min(16vh,128px);letter-spacing:.14em;padding-left:.14em;color:var(--mode-accent)}
@keyframes count{0%{opacity:0;transform:translate(-50%,-50%) scale(1.4)}25%{opacity:1;transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(.92)}}
#announce{position:absolute;left:50%;top:24%;transform:translate(-50%,-50%);text-align:center;opacity:0;display:flex;flex-direction:column;align-items:center;gap:10px;white-space:nowrap;transition:opacity .35s}
#announce strong{font-size:clamp(34px,4.2vw,62px);font-weight:800;line-height:1.1;letter-spacing:.06em;color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.5)}
#announce span{font-size:14px;font-weight:500;padding:6px 16px;border-radius:999px;background:var(--solid);border:1px solid var(--line);color:var(--sub)}
#announce span:empty,#announce strong:empty{display:none}
#announce[data-style="ko"] strong{color:var(--gold)}
#announce[data-style="small"] strong{font-size:clamp(24px,2.8vw,40px)}
#announce.visible{opacity:1;animation:announceIn .4s cubic-bezier(.2,1.2,.4,1)}
@keyframes announceIn{0%{opacity:0;transform:translate(-50%,-50%) scale(1.12)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
#respawn{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);text-align:center;display:flex;flex-direction:column;gap:4px;padding:14px 28px;border-radius:14px;background:var(--solid);border:1px solid color-mix(in srgb,var(--bad) 45%,transparent)}
#respawn strong{font-size:22px;font-weight:700;color:#ff9195}
#respawn span{font-size:13px;color:var(--sub)}
#wrong-way{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%);padding:10px 26px 10px calc(26px + .2em);border-radius:999px;background:var(--bad);color:#fff;font-size:26px;font-weight:800;letter-spacing:.2em;animation:pulse .45s infinite alternate}
#spectate{position:absolute;left:50%;bottom:112px;transform:translateX(-50%);font-size:14px;padding:7px 18px;border-radius:999px;background:var(--solid);border:1px solid var(--line);color:var(--sub)}
#spectate b{color:var(--text);margin:0 2px}
#combo{position:absolute;left:50%;top:33%;transform:translateX(-50%);font-size:26px;font-weight:800;letter-spacing:.1em;color:var(--gold);text-shadow:0 2px 14px rgba(0,0,0,.5)}
#controls-hint{position:absolute;left:16px;bottom:16px;padding:9px 14px;display:flex;flex-wrap:wrap;gap:8px 14px;max-width:380px;font-size:12px;color:var(--sub);opacity:0;transform:translateY(8px);transition:opacity .6s,transform .6s}
#controls-hint.show{opacity:1;transform:none}
#controls-hint span{display:inline-flex;gap:6px;align-items:center}
#edge-danger{position:absolute;inset:0;opacity:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(255,50,70,.45) 100%);transition:opacity .15s}
.name-labels,#offscreen{position:absolute;inset:0}
.car-label{--c:#fff;position:absolute;left:0;top:0;margin-top:-26px;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px 3px 8px;border-radius:999px;background:rgba(12,14,19,.72);white-space:nowrap;translate:-50% 0;will-change:transform}
.car-label::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.indicator{--c:#fff;position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:3px;translate:-50% -50%;will-change:transform}
.indicator i{width:0;height:0;border-left:13px solid var(--c);border-top:7px solid transparent;border-bottom:7px solid transparent}
.indicator span{font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:999px;background:rgba(12,14,19,.72)}
.indicator[data-type="crown"] i{border-left-width:19px;border-top-width:10px;border-bottom-width:10px}
.top-controls{position:absolute;right:16px;top:14px;display:flex;gap:6px;z-index:3}
.icon-btn{width:38px;height:38px;display:grid;place-items:center;border-radius:50%;background:var(--panel);border:1px solid var(--line);color:var(--sub);transition:color .15s,background .15s}
.icon-btn svg{width:17px;height:17px}
.icon-btn:hover{background:var(--panel-hi);color:var(--text)}
#sound-btn .cross{display:none}#sound-btn.muted .cross{display:block}#sound-btn.muted .waves{display:none}
#game-ui:not([data-screen="playing"]) #pause-btn{display:none}
.touch-controls{display:none}
@media (pointer:coarse){
  .touch-controls{display:block;position:absolute;inset:0;pointer-events:none}
  .touch-controls button{position:absolute;width:64px;height:64px;font-size:20px;border-radius:50%;background:rgba(14,16,21,.55);border:1px solid rgba(255,255,255,.2);color:var(--text);pointer-events:auto}
  .touch-controls .pressed{background:rgba(255,255,255,.9);color:#0b0c10}
  .t-left{left:24px;bottom:110px}.t-right{left:104px;bottom:110px}.t-up{right:24px;bottom:190px}.t-down{right:24px;bottom:110px}
  .t-drift{right:104px;bottom:110px;font-size:13px!important}.t-item{right:184px;bottom:110px;font-size:13px!important}
  .t-nitro{right:104px;bottom:190px;font-size:13px!important;color:#9bd0ff!important;border-color:color-mix(in srgb,var(--nitro) 70%,transparent)!important}
  #speedo{bottom:272px;transform:scale(.86);transform-origin:right bottom}
  #controls-hint{display:none}
}

/* ------------------------------------------------------------ 暂停与结算 */
.pause-screen{display:grid;place-items:center;background:rgba(6,7,10,.5);pointer-events:auto}
.dialog{width:min(380px,90vw);padding:28px 30px 20px;display:flex;flex-direction:column;gap:10px;text-align:center;border-radius:18px;background:var(--solid)}
.dialog h2{margin:0;font-size:30px;font-weight:700;letter-spacing:.12em;padding-left:.12em}
.dialog p{margin:0 0 10px;color:var(--sub);font-size:13px}
.dialog .quick-settings{justify-content:center;margin-top:8px}
.dialog small{color:var(--dim);font-size:12px;margin-top:4px}
.results-screen{pointer-events:auto;background:radial-gradient(ellipse 46% 26% at 50% 13%,rgba(8,9,13,.62),rgba(8,9,13,0)),linear-gradient(0deg,rgba(8,9,13,.84),rgba(8,9,13,0) 48%)}
.results-wrap{position:absolute;inset:0;padding:4vh 4vw 3.2vh;display:flex;flex-direction:column}
.results-wrap header{text-align:center}
.eyebrow{margin:0;font-size:14px;font-weight:500;letter-spacing:.12em;color:var(--sub);text-shadow:0 1px 8px rgba(0,0,0,.6)}
.result-title{margin:8px 0 6px;font-size:clamp(48px,6vw,92px);font-weight:800;line-height:1.05;letter-spacing:.02em;color:#fff;text-shadow:0 3px 24px rgba(0,0,0,.45)}
.result-title[data-win="1"]{color:var(--gold)}
.result-sub{display:inline-block;margin:0;padding:5px 16px;border-radius:999px;background:rgba(10,11,15,.62);color:var(--text);font-size:15px}
.result-cols{flex:1;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;min-height:0;padding-top:2vh}
.standings-panel,.stats-panel{width:min(360px,30vw);padding:14px 14px 12px;max-height:100%;overflow:auto;background:var(--solid)}
.standings-panel h3,.stats-panel h3{margin:0 4px 10px;font-size:13px;font-weight:500;color:var(--sub);letter-spacing:.06em}
.final,.tour-table{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.final li,.tour-table li{grid-template-columns:20px 3px 1fr auto auto;font-size:15px;padding:6px 8px}
.final li .val,.tour-table li .val{font-family:var(--num);font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.final li em{font-style:normal;font-family:var(--num);color:var(--gold);font-size:13px}
.final li.me,.tour-table li.me{background:color-mix(in srgb,var(--mode-accent) 20%,transparent)}
.final li.me b,.tour-table li.me b{font-weight:700}
.final li small{font-size:11px;padding:1px 7px;margin-left:6px;border-radius:999px;background:var(--mode-accent);color:#0b0c10;font-weight:600}
.stats{margin:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stats div{padding:8px 10px;border-radius:8px;background:rgba(255,255,255,.04)}
.stats dt{font-size:12px;color:var(--dim)}
.stats dd{margin:3px 0 0;font-family:var(--num);font-weight:600;font-size:19px}
.tour-panel{margin-top:16px}
.tour-next{margin:10px 4px 0;font-size:13px;color:var(--sub)}
.tour-next b{color:var(--text)}
.result-actions{display:flex;justify-content:center;gap:12px;padding-top:18px}

/* ------------------------------------------------------------ 转场：短暂压暗 */
#wipe{position:absolute;inset:0;pointer-events:none;background:var(--bg);opacity:0;z-index:9}
#wipe.go{animation:wipe .8s ease}
@keyframes wipe{0%{opacity:0}30%{opacity:1}55%{opacity:1}100%{opacity:0}}

@media (max-width:1100px){
  .mode-grid{grid-template-columns:repeat(3,1fr)}
  .mode-card{min-height:150px}.mode-card p{display:none}
  .menu-screen{grid-template-columns:1fr}
  .step{width:min(560px,92vw)}
  .standings-panel,.stats-panel{width:46vw}
}
@media (max-height:760px){
  .mode-card{min-height:150px}.mode-card p{font-size:12px;line-height:1.5}
  .logo{font-size:clamp(52px,6.2vw,100px)}
  #race-pos b{font-size:50px}
}
