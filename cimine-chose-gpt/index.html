<html lang="en">

* { box-sizing: border-box; }
html, body, #app { margin: 0; width: 100%; height: 100%; overflow: hidden; }
body { overscroll-behavior: none; }
#app { position: relative; isolation: isolate; user-select: none; }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, #theater:focus-visible { outline: 2px solid #81acff; outline-offset: 4px; }
button:disabled { cursor: default; }
#stage, #show, #tickets, #checkout { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
#stage, #map { width: 1000px; height: 1000px; pointer-events: none; }
#map { position: absolute; inset: 0; }
#theater, #shade { position: absolute; inset: 0; width: 100%; height: 100%; display: block; opacity: 0; pointer-events: none; }
#theater { touch-action: none; }
#theater.live { pointer-events: auto; cursor: grab; }
#theater.live.looking { cursor: grabbing; }
#shade { background: linear-gradient(to bottom,rgba(0,0,0,.55),transparent 17%,transparent 65%,rgba(0,0,0,.48) 85%,rgba(0,0,0,.81)); }
#show { pointer-events: none; white-space: nowrap; }
#show h1 { font-size: 23px; font-weight: 650; line-height: 29px; letter-spacing: -.72px; margin: 0; }
#show p { margin: 4px 0 0; color: #989898; font-size: 16px; line-height: 21px; letter-spacing: -.18px; }
#tickets { width: 188px; height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 5px; background: linear-gradient(165deg,#292929,#1b1b1b 80%); border: 1px solid #363636; border-radius: 30px; }
#tickets button { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(#3c3c3c,#2e2e2e); display: grid; place-items: center; padding: 0; border: 1px solid #454545; }
#tickets button:hover:enabled { background: #474747; }
#tickets button:disabled { opacity: .45; }
#tickets svg { width: 16px; height: 16px; stroke: #eee; stroke-width: 1.6; stroke-linecap: round; fill: none; }
#count { font-size: 17px; font-weight: 550; line-height: 1; letter-spacing: -.35px; }
#checkout { width: 512px; }
.purchase-info { border-top: 1px solid #333; height: 55px; display: flex; align-items: center; justify-content: space-between; }
.purchase-info strong { font-size: 17px; font-weight: 550; letter-spacing: -.35px; }
.purchase-info span { color: #a4a4a4; font-size: 16px; font-variant-numeric: tabular-nums; }
.actions { display: grid; grid-template-columns: 168px 332px; gap: 12px; }
.actions button { height: 64px; border-radius: 36px; display: inline-flex; align-items: center; justify-content: center; gap: 10px; font-size: 18px; font-weight: 600; letter-spacing: -.35px; transition: background .15s, transform .15s; }
.actions button:active:enabled { transform: scale(.98); }
#preview { border: 1px solid #424242; background: linear-gradient(165deg,#282828,#1b1b1b); }
#preview:hover:enabled { background: #323232; }
#preview svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.45; stroke-linecap: round; stroke-linejoin: round; }
#preview .seats-icon, #preview.inside .cube-icon { display: none; }
#preview.inside .seats-icon { display: block; }
#book { background: #efeeec; color: #151515; border: 1px solid #fafafa; }
#book:hover:enabled { background: #fff; }
#mini { position: absolute; bottom: calc(100% + 12px); left: 50%; width: 278px; transform: translateX(-50%); height: 88px; border-radius: 21px; pointer-events: none; opacity: 0; overflow: hidden; background: linear-gradient(115deg,#151618bd,#141414b3); border: 1px solid #ffffff12; backdrop-filter: blur(9px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; mask-image: linear-gradient(transparent,#000 24%,#000 76%,transparent); }
.mini-line { height: 15px; display: flex; gap: 3px; align-items: center; }
.mini-line.neighbor { opacity: .34; filter: blur(1.15px); }
.mini-line i { display: grid; place-items: center; font: 600 9px/1 Arial,sans-serif; width: 14px; height: 14px; border-radius: 3px; border: 1px solid #666; background: #171717; color: white; }
.mini-line i:nth-of-type(7) { margin-left: 12px; }
.mini-line i.sold { background: #393939; border-color: #484848; }
.mini-line i.chosen { background: #4181f0; border-color: #6899ef; }
.mini-line i.chosen { position: relative; }
.mini-line button { position: absolute; inset: -7px -2px; padding: 0; background: transparent; border: 0; font: inherit; color: white; border-radius: 4px; }
#mini.live button { pointer-events: auto; }
.mini-line button[aria-pressed=true]::after { content: ''; position: absolute; bottom: 2px; height: 2px; border-radius: 1px; background: #8db5ff; left: 25%; width: 50%; }
.mini-line button:hover { box-shadow: inset 0 0 0 1px #8db5ff; }
.mini-line b { font-size: 10px; color: #a3a3a3; font-weight: 500; width: 13px; text-align: center; }
#notice { position: absolute; top: 9%; left: 50%; transform: translateX(-50%); background: #252525; color: #fff; border-radius: 16px; font-size: 14px; text-align: center; padding: 10px 16px; pointer-events: none; width: max-content; max-width: 90%; }
#notice:empty { display: none; }
#receipt { color: #181917; background: #efeeea; border: 0; border-radius: 20px; padding: 28px; width: min(360px,90vw); box-shadow: 0 18px 85px #0009; }
#receipt::backdrop { background: #0009; backdrop-filter: blur(6px); }
.stub-top, .ticket-details { display: flex; justify-content: space-between; }
.stub-top, .ticket-details small { font-size: 10px; letter-spacing: 2px; font-weight: 650; color: #63645f; }
#receipt h2 { margin: 25px 0 4px; font-size: 26px; letter-spacing: -1px; }
#receipt p { margin: 0; color: #5f605c; font-size: 14px; }
.ticket-details { margin: 24px 0 20px; padding: 19px 0; border-block: 1px dashed #babbb5; }
.ticket-details div { display: grid; gap: 5px; }
#receipt .demo-label { text-align: center; font-size: 12px; }
#receipt button { width: 100%; border-radius: 25px; border: 0; background: #1e1f1d; color: white; padding: 12px; margin-top: 17px; font-weight: 600; }

.sm-map {
  position: absolute;
  left: 0;
  top: 0;
  width: 1000px;
  height: 1000px;
  color: #f2f2f2;
  font-family: inherit;
  pointer-events: none;
  user-select: none;
  -webkit-user-select: none;
  --sm-blue: #4181f0;
  --sm-seat-line: #4b4b4d;
}
.sm-screen {
  position: absolute;
  left: 283px;
  top: 258px;
  width: 434px;
  height: 48px;
  overflow: visible;
}
.sm-screen-label, .sm-row {
  position: absolute;
  transform: translate(-50%, -50%);
  line-height: 1;
}
.sm-screen-label {
  top: 281px;
  left: 501px;
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 2.9px;
  color: #929293;
}
.sm-row {
  font-size: 12px;
  font-weight: 500;
  color: #8c8c8d;
}
.sm-map .sm-seat {
  box-sizing: border-box;
  position: absolute;
  display: grid;
  place-items: center;
  width: 32px;
  height: 36px;
  padding: 0;
  margin: 0;
  border: 0;
  background: none;
  color: inherit;
  font: inherit;
  appearance: none;
  transform: translate(-50%, -50%);
  touch-action: none;
  pointer-events: auto;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  outline: none;
}
.sm-face {
  position: relative;
  display: grid;
  place-items: center;
  width: 27px;
  height: 26px;
  box-sizing: border-box;
  border: 1px solid var(--sm-seat-line);
  border-radius: 6px;
  background-color: #101010;
  font-size: 12px;
  font-weight: 600;
  line-height: 1;
  letter-spacing: -.25px;
  font-variant-numeric: tabular-nums;
  color: white;
  pointer-events: none;
}
.sm-face::after {
  content: '';
  position: absolute;
  height: 2px;
  width: 19px;
  left: 50%;
  bottom: -5px;
  border-radius: 1.5px;
  transform: translateX(-50%);
  background: var(--sm-seat-line);
}
.sm-taken .sm-face {
  background: #1b1b1b;
  border-color: #29292b;
}
.sm-taken .sm-face::after { background: #2a2a2b; }
.sm-map .sm-taken { cursor: default; }
.sm-map .sm-yours { cursor: grab; }
.sm-yours .sm-face, .sm-face.sm-ghost {
  background: var(--sm-blue);
  border-color: #5795ff;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.09);
}
.sm-yours .sm-face::after, .sm-ghost::after { background: var(--sm-blue); }
.sm-target .sm-face {
  border-color: #619aff;
  box-shadow: 0 0 0 .25px #619aff;
  background: transparent;
}
.sm-target .sm-face::after { background: var(--sm-blue); }
.sm-dragging, .sm-map.sm-dragging .sm-seat { cursor: grabbing; }
.sm-seat:focus-visible .sm-face {
  outline: 2px solid #cbdcff;
  outline-offset: 3px;
}
@media (hover: hover) {
  .sm-map:not(.sm-dragging) .sm-seat:not(.sm-taken):not(.sm-yours):hover .sm-face {
    background: #1b1b1c;
    border-color: #8a8a8e;
  }
}
.sm-legend {
  position: absolute;
  top: 678px;
  left: 500px;
  transform: translate(-50%, -50%);
  display: flex;
  align-items: center;
  gap: 23px;
  color: #a0a0a1;
  font-size: 13px;
  line-height: 18px;
}
.sm-legend span { display: inline-flex; align-items: center; gap: 7px; }
.sm-legend i {
  display: inline-block;
  box-sizing: border-box;
  width: 12px;
  height: 12px;
  border-radius: 3px;
  border: 1px solid var(--sm-seat-line);
  background: #101010;
}
.sm-legend .sm-key-taken { background: #1b1b1b; border-color: #29292b; }
.sm-legend .sm-key-yours { background: var(--sm-blue); border-color: #5795ff; }
.sm-lift {
  position: absolute;
  inset: 0;
  z-index: 3;
  pointer-events: none;
  will-change: transform;
}
.sm-face.sm-ghost {
  position: absolute;
  transform: translate(-50%, calc(-50% - 4px)) scale(1.055);
  box-shadow: 0 5px 12px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.14);
}
.sm-bubble {
  position: absolute;
  transform: translate(-50%,-100%);
  padding: 7px 12px;
  border-radius: 9999px;
  background: #f7f7f6;
  color: #171717;
  font-size: 13px;
  line-height: 16px;
  font-weight: 550;
  white-space: nowrap;
  box-shadow: 0 4px 15px #0005;
}
</style>
