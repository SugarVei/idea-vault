      backWall.rotation.y = Math.PI;
      backWall.position.set(0, GEOM.ceilingY * 0.5, GEOM.backWallZ);
      hallGroup.add(backWall);

      // Dense warm-white vertical light strips along both side walls:
      // Shorter & more tightly packed toward the screen -> powerful architectural perspective!
      const STRIP_COUNT = 16;
      const stripCoreMat = new THREE.MeshBasicMaterial({
        color: 0xFFE9C6
      });
      const stripRecessMat = new THREE.MeshStandardMaterial({
        color: 0x09090b,
        roughness: 0.9
      });
      const stripHaloMat = new THREE.MeshBasicMaterial({
        map: warmStripGlowTex,
        transparent: true,
        opacity: 0.66,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        side: THREE.DoubleSide
      });
      const stripWashMat = new THREE.MeshBasicMaterial({
        map: wallWashTex,
        transparent: true,
        opacity: 0.25,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      for (const side of [-1, 1]) {
        const wallX = side * GEOM.hallHalfW;
        const inward = -side; // +1 for left wall, -1 for right wall

        for (let i = 0; i < STRIP_COUNT; i++) {
          // t=0 near screen, t=1 near back audience rows
          const t = i / (STRIP_COUNT - 1);
          // Nonlinear spacing: tight near screen, progressively wider toward back rows
          const z = 1.25 + 11.75 * Math.pow(t, 1.38);

          // Floor elevation at this Z
          const rowFrac = THREE.MathUtils.clamp((z - GEOM.zA) / (7 * GEOM.dz), 0, 1);
          const localFloor = GEOM.floorA + rowFrac * 7 * GEOM.dy;

          // Strip length shortens smoothly toward the screen (3.85m near rear -> 1.85m near screen)
          const stripH = 1.85 + 2.05 * Math.pow(t, 0.92);
          const stripBottom = localFloor + 0.95 + 0.12 * (1 - t);
          const stripCenterY = stripBottom + stripH * 0.5;

          // Subtle architectural vertical acoustic rib/recess
          const rib = new THREE.Mesh(
            new THREE.BoxGeometry(0.06, stripH + 0.18, 0.11),
            stripRecessMat
          );
          rib.position.set(wallX + inward * 0.02, stripCenterY, z);
          hallGroup.add(rib);

          // Thin bright warm-white luminous filament
          const coreW = 0.022 + 0.010 * t;
          const core = new THREE.Mesh(
            new THREE.BoxGeometry(0.018, stripH, coreW),
            stripCoreMat
          );
          core.position.set(wallX + inward * 0.052, stripCenterY, z);
          hallGroup.add(core);

          // Soft blooming halo right over the strip
          const haloPlane = new THREE.Mesh(
            new THREE.PlaneGeometry(0.28 + 0.10 * t, stripH * 1.12),
            stripHaloMat
          );
          haloPlane.rotation.y = side === -1 ? Math.PI / 2 : -Math.PI / 2;
          haloPlane.position.set(wallX + inward * 0.075, stripCenterY, z);
          hallGroup.add(haloPlane);

          // Soft warm wash on the dark acoustic wall behind each strip
          const washPlane = new THREE.Mesh(
            new THREE.PlaneGeometry(0.66 + 0.24 * t, stripH * 1.26),
            stripWashMat
          );
          washPlane.rotation.y = side === -1 ? Math.PI / 2 : -Math.PI / 2;
          washPlane.position.set(wallX + inward * 0.015, stripCenterY, z);
          hallGroup.add(washPlane);
        }
      }

      /* --- Matte Black Ceiling + Sparse Warm Recessed Spotlights ---
         FrontSide facing -Y, plus opacity fade when camera is above ceiling during overview! */
      const ceilingGroup = new THREE.Group();
      scene.add(ceilingGroup);

      const ceilingMat = new THREE.MeshStandardMaterial({
        color: 0x070709,
        roughness: 0.96,
        metalness: 0.02,
        transparent: true,
        opacity: 1
      });
      const ceilingMesh = new THREE.Mesh(
        new THREE.PlaneGeometry(GEOM.hallHalfW * 2 + 0.4, hallDepth + 0.4),
        ceilingMat
      );
      ceilingMesh.rotation.x = Math.PI / 2; // faces downward (-Y)
      ceilingMesh.position.set(0, GEOM.ceilingY, hallDepth * 0.5 - 0.1);
      ceilingGroup.add(ceilingMesh);

      const ceilingSpotMats = [];
      const spotPositions = [
        [-2.5, 2.5], [2.5, 2.5],
        [-2.5, 5.6], [2.5, 5.6],
        [-2.5, 9.2], [2.5, 9.2],
        [-2.5, 12.2], [2.5, 12.2]
      ];
      for (const [sx, sz] of spotPositions) {
        const bulbMat = new THREE.MeshBasicMaterial({
          color: 0xFFD292,
          transparent: true,
          opacity: 0.78
        });
        ceilingSpotMats.push(bulbMat);
        const bulb = new THREE.Mesh(new THREE.CircleGeometry(0.068, 20), bulbMat);
        bulb.rotation.x = Math.PI / 2;
        bulb.position.set(sx, GEOM.ceilingY - 0.015, sz);
        ceilingGroup.add(bulb);

        const glowMat = new THREE.MeshBasicMaterial({
          map: spotGlowTex,
          transparent: true,
          opacity: 0.36,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        });
        ceilingSpotMats.push(glowMat);
        const glow = new THREE.Mesh(new THREE.PlaneGeometry(0.92, 0.92), glowMat);
        glow.rotation.x = Math.PI / 2;
        glow.position.set(sx, GEOM.ceilingY - 0.025, sz);
        ceilingGroup.add(glow);
      }

      /* --- 96 Boutique Plush Charcoal Fabric Cinema Seats (High-Detail Shared Geometry) --- */
      function buildRoundedBoxGeometry(w, h, d, r, bevelSegs) {
        // Extrude a rounded rectangle in XY and center along Z with smooth bevel
        const hw = w * 0.5 - r;
        const hh = h * 0.5 - r;
        const shape = new THREE.Shape();
        shape.moveTo(-hw, -hh - r);
        shape.lineTo(hw, -hh - r);
        shape.quadraticCurveTo(hw + r, -hh - r, hw + r, -hh);
        shape.lineTo(hw + r, hh);
        shape.quadraticCurveTo(hw + r, hh + r, hw, hh + r);
        shape.lineTo(-hw, hh + r);
        shape.quadraticCurveTo(-hw - r, hh + r, -hw - r, hh);
        shape.lineTo(-hw - r, -hh);
        shape.quadraticCurveTo(-hw - r, -hh - r, -hw, -hh - r);

        const bevel = Math.min(r * 0.72, d * 0.34);
        const geo = new THREE.ExtrudeGeometry(shape, {
          depth: Math.max(0.01, d - bevel * 2),
          bevelEnabled: true,
          bevelThickness: bevel,
          bevelSize: bevel,
          bevelSegments: bevelSegs || 4,
          curveSegments: 8
        });
        geo.center();
        return geo;
      }

      function buildPlushSeatbackGeometry() {
        // Wide, plush rounded-top cinema backrest (width 0.64m, height 0.78m, thickness 0.16m)
        const geo = buildRoundedBoxGeometry(0.64, 0.76, 0.165, 0.11, 5);
        // Gently curve the backrest crown and bolster edges for authentic boutique velvet highlights
        const pos = geo.attributes.position;
        for (let i = 0; i < pos.count; i++) {
          let x = pos.getX(i);
          let y = pos.getY(i);
          let z = pos.getZ(i);
          const nx = x / 0.32;
          const ny = y / 0.38;
          // Slight ergonomic wrap-around curve (edges curve slightly forward toward -Z)
          z -= nx * nx * 0.026;
          // Slight pillow puffiness in center of upper headrest
          if (z < 0) z -= Math.max(0, 1 - nx * nx) * Math.max(0, 0.5 + ny * 0.5) * 0.018;
          // Subtle taper at top corners for soft silhouette
          const topTaper = 1.0 - Math.max(0, ny) * 0.045;
          x *= topTaper;
          pos.setXYZ(i, x, y, z);
        }
        geo.computeVertexNormals();
        return geo;
      }

      const seatBackGeo = buildPlushSeatbackGeometry();
      const seatCushionGeo = buildRoundedBoxGeometry(0.62, 0.16, 0.58, 0.075, 4);
      const seatArmGeo = buildRoundedBoxGeometry(0.088, 0.11, 0.52, 0.036, 3);
      const seatPedestalGeo = new THREE.BoxGeometry(0.46, 0.36, 0.32);

      // Materials: dark charcoal plush velvet with subtle micro-sheen
      const fabricBackMat = new THREE.MeshStandardMaterial({
        color: 0x1b1c20,
        bumpMap: fabricBump,
        bumpScale: 0.012,
        roughness: 0.84,
        metalness: 0.04
      });

      const fabricBackTakenMat = new THREE.MeshStandardMaterial({
        color: 0x141519,
        bumpMap: fabricBump,
        bumpScale: 0.012,
        roughness: 0.87,
        metalness: 0.03
      });

      const fabricCushionFreeMat = new THREE.MeshStandardMaterial({
        color: 0x18191e,
        bumpMap: fabricBump,
        bumpScale: 0.012,
        roughness: 0.84,
        metalness: 0.04
      });

      const fabricCushionTakenMat = new THREE.MeshStandardMaterial({
        color: 0x121317,
        bumpMap: fabricBump,
        bumpScale: 0.012,
        roughness: 0.88,
        metalness: 0.03
      });

      // Signature rich #4181F0 plush blue cushion (calibrated for ACES tone mapping so it stays vivid royal blue, not pastel!)
      const fabricCushionSelectedMat = new THREE.MeshStandardMaterial({
        color: 0x2668f0,
        emissive: 0x1852d6,
        emissiveIntensity: 0.48,
        bumpMap: fabricBump,
        bumpScale: 0.010,
        roughness: 0.72,
        metalness: 0.05
      });

      const fabricArmMat = new THREE.MeshStandardMaterial({
        color: 0x14151a,
        bumpMap: fabricBump,
        bumpScale: 0.009,
        roughness: 0.82,
        metalness: 0.06
      });

      const seatPedestalMat = new THREE.MeshStandardMaterial({
        color: 0x0c0d10,
        roughness: 0.72,
        metalness: 0.25
      });

      // Use InstancedMesh for static seatbacks, arms, pedestals -> super crisp & ultra-fast 60fps
      const count96 = SEATS.length;
      const instBack = new THREE.InstancedMesh(seatBackGeo, fabricBackMat, count96);
      const instArmL = new THREE.InstancedMesh(seatArmGeo, fabricArmMat, count96);
      const instArmR = new THREE.InstancedMesh(seatArmGeo, fabricArmMat, count96);
      const instBase = new THREE.InstancedMesh(seatPedestalGeo, seatPedestalMat, count96);

      const cushionMeshes = [];
      const dummy = new THREE.Object3D();

      SEATS.forEach((s, idx) => {
        const { x, y, z, floorY } = s.world;

        // 1. Individual cushion mesh positioned cleanly under the 2D seat footprint so full square cushion shows in overview!
        const cushion = new THREE.Mesh(
          seatCushionGeo,
          s.taken ? fabricCushionTakenMat : fabricCushionFreeMat
        );
        cushion.position.set(x, y - 0.02, z - 0.03);
        scene.add(cushion);
        cushionMeshes.push(cushion);

        // 2. Plush tall backrest positioned cleanly behind the cushion (+Z = bottom edge in overview!)
        dummy.position.set(x, floorY + 0.75, z + 0.315);
        dummy.rotation.set(-0.14, 0, 0); // subtle reclined lounge tilt
        dummy.scale.set(1, 1, 1);
        dummy.updateMatrix();
        instBack.setMatrixAt(idx, dummy.matrix);

        // 3. Left & right upholstered armrests
        dummy.rotation.set(0, 0, 0);
        dummy.position.set(x - 0.345, floorY + 0.62, z + 0.04);
        dummy.updateMatrix();
        instArmL.setMatrixAt(idx, dummy.matrix);

        dummy.position.set(x + 0.345, floorY + 0.62, z + 0.04);
        dummy.updateMatrix();
        instArmR.setMatrixAt(idx, dummy.matrix);

        // 4. Support base pedestal
        dummy.position.set(x, floorY + 0.20, z + 0.06);
        dummy.updateMatrix();
        instBase.setMatrixAt(idx, dummy.matrix);
      });

      instBack.instanceMatrix.needsUpdate = true;
      instArmL.instanceMatrix.needsUpdate = true;
      instArmR.instanceMatrix.needsUpdate = true;
      instBase.instanceMatrix.needsUpdate = true;

      scene.add(instBack, instArmL, instArmR, instBase);

      // Update which 3D seat cushions glow blue to match the active selected seats
      function sync3DSelectedSeats() {
        for (let i = 0; i < SEATS.length; i++) {
          const s = SEATS[i];
          const isSel = s.r === state.selectedRow && state.selectedCols.includes(s.c);
          if (isSel) {
            cushionMeshes[i].material = fabricCushionSelectedMat;
          } else {
            cushionMeshes[i].material = s.taken ? fabricCushionTakenMat : fabricCushionFreeMat;
          }
        }
      }
      sync3DSelectedSeats();

      /* =====================================================================
         5. 2D SEAT MAP, DRAG-TO-RELOCATE, MINI MAP & HUD DOM CONSTRUCTION
         ===================================================================== */
      const mapStage = document.getElementById('map-stage');
      const screenArcGroup = document.getElementById('screen-arc-group');
      const staticLayer = document.getElementById('seats-static-layer');
      const ghostLayer = document.getElementById('seats-ghost-layer');
      const selectedLayer = document.getElementById('seats-selected-layer');
      const dragLayer = document.getElementById('seats-drag-layer');
      const legendRow = document.getElementById('legend-row');
      const mapDivider = document.getElementById('map-divider');
      const theaterVeil = document.getElementById('theater-veil');
      const lookLayer = document.getElementById('look-layer');

      const hudHeader = document.getElementById('hud-header');
      const hudStepper = document.getElementById('hud-stepper');
      const hudBottom = document.getElementById('hud-bottom');
      const miniMapWrap = document.getElementById('mini-map-wrap');
      const miniMapTrack = document.getElementById('mini-map-track');
      const dragTooltip = document.getElementById('drag-tooltip');
      const bookingToast = document.getElementById('booking-toast');

      const btnMinus = document.getElementById('btn-minus');
      const btnPlus = document.getElementById('btn-plus');
      const ticketCountLabel = document.getElementById('ticket-count-label');
      const summarySeatsEl = document.getElementById('summary-seats');
      const summaryPriceEl = document.getElementById('summary-price');
      const btnPreview = document.getElementById('btn-preview');
      const btnPreviewLabel = document.getElementById('btn-preview-label');
      const btnBook = document.getElementById('btn-book');

      function createSeatDom(sw, sh, className, labelText) {
        const el = document.createElement('div');
        el.className = `seat-node ${className}`;
        el.style.setProperty('--sw', `${sw.toFixed(2)}px`);
        el.style.setProperty('--sh', `${sh.toFixed(2)}px`);

        const back = document.createElement('div');
        back.className = 'seat-back';
        if (labelText !== undefined && labelText !== '') back.textContent = labelText;

        const bar = document.createElement('div');
        bar.className = 'seat-bar';

        el.appendChild(back);
        el.appendChild(bar);
        return el;
      }

      // Build static 96 seat slots + left/right row labels A–H
      const staticSeatEls = [];
      for (let r = 0; r < 8; r++) {
        const rp = ROW_PROJ[r];
        // Left & right row labels nestled cleanly inside x=244..756 alongside each expanding row
        const pad = 25;
        const leftLbl = document.createElement('div');
        leftLbl.className = 'row-label';
        leftLbl.textContent = ROWS[r];
        leftLbl.style.left = `${Math.max(250, rp.leftX - pad).toFixed(1)}px`;
        leftLbl.style.top = `${rp.y.toFixed(1)}px`;
        staticLayer.appendChild(leftLbl);

        const rightLbl = document.createElement('div');
        rightLbl.className = 'row-label';
        rightLbl.textContent = ROWS[r];
        rightLbl.style.left = `${Math.min(750, rp.rightX + pad).toFixed(1)}px`;
        rightLbl.style.top = `${rp.y.toFixed(1)}px`;
        staticLayer.appendChild(rightLbl);
      }

      for (const s of SEATS) {
        const el = createSeatDom(s.sw, s.sh, s.taken ? 'taken' : 'free', '');
        el.style.left = `${s.dx.toFixed(2)}px`;
        el.style.top = `${s.dy.toFixed(2)}px`;
        el.dataset.row = s.r;
        el.dataset.col = s.c;

        // Clicking an empty seat smoothly moves the group to the nearest valid group containing it
        if (!s.taken) {
          el.addEventListener('click', () => {
            if (state.mode !== 'MAP' || state.drag.active) return;
            const groups = getAllValidGroups(state.ticketCount).filter(
              g => g.r === s.r && g.cols.includes(s.c)
            );
            let target = null;
            if (groups.length > 0) {
              // Prefer group whose center is closest to clicked seat
              target = groups.reduce((a, b) =>
                Math.abs(a.cx - s.dx) <= Math.abs(b.cx - s.dx) ? a : b
              );
            } else {
              target = findNearestValidGroup(s.dx, s.dy, state.ticketCount);
            }
            if (target) {
              commitSeatSelection(target.r, target.cols);
            }
          });
        }
        staticLayer.appendChild(el);
        staticSeatEls.push(el);
      }

      // Render the active blue selected seat nodes in selectedLayer
      function renderSelectedSeats2D() {
        selectedLayer.innerHTML = '';
        if (state.drag.active) return; // While lifted, original slots show hollow Free seats beneath!

        for (const col of state.selectedCols) {
          const s = SEAT_BY_RC[state.selectedRow][col];
          const el = createSeatDom(s.sw, s.sh, 'selected', String(col));
          el.style.left = `${s.dx.toFixed(2)}px`;
          el.style.top = `${s.dy.toFixed(2)}px`;
          el.dataset.row = s.r;
          el.dataset.col = s.c;
          el.addEventListener('pointerdown', onSelectedSeatPointerDown);
          selectedLayer.appendChild(el);
        }
      }

      function renderGhostCandidate(cand) {
        ghostLayer.innerHTML = '';
        if (!cand) return;
        for (const col of cand.cols) {
          const s = SEAT_BY_RC[cand.r][col];
          const el = createSeatDom(s.sw, s.sh, 'ghost', '');
          el.style.left = `${s.dx.toFixed(2)}px`;
          el.style.top = `${s.dy.toFixed(2)}px`;
          ghostLayer.appendChild(el);
        }
      }

      function updateSummaryUI() {
        const count = state.ticketCount;
        const total = (count * TICKET_PRICE).toFixed(2);
        ticketCountLabel.textContent = count === 1 ? '1 ticket' : `${count} tickets`;
        btnMinus.disabled = count <= 1;
        btnPlus.disabled = count >= 4;

        const rowLetter = ROWS[state.selectedRow];
        const seatWord = count === 1 ? 'Seat' : 'Seats';
        summarySeatsEl.textContent = `Row ${rowLetter} · ${seatWord} ${formatSeatRange(state.selectedCols)}`;
        summaryPriceEl.textContent = `${count} × €${TICKET_PRICE.toFixed(2)}`;
        btnBook.textContent = `Book seats · €${total}`;
      }

      // Build & update the translucent mini seat map shown below the seated view
      function buildMiniMap() {
        miniMapTrack.innerHTML = '';
        for (let r = 0; r < 8; r++) {
          const rowEl = document.createElement('div');
          rowEl.className = 'mini-row';
          rowEl.dataset.row = r;

          const lLbl = document.createElement('div');
          lLbl.className = 'mini-row-label';
          lLbl.textContent = ROWS[r];
          rowEl.appendChild(lLbl);

          const leftSide = document.createElement('div');
          leftSide.className = 'mini-side';
          const rightSide = document.createElement('div');
          rightSide.className = 'mini-side';

          for (let c = 1; c <= 12; c++) {
            const seatEl = document.createElement('div');
            seatEl.className = 'mini-seat';
            seatEl.dataset.row = r;
            seatEl.dataset.col = c;
            const b = document.createElement('div');
            b.className = 'mini-seat-back';
            const l = document.createElement('div');
            l.className = 'mini-seat-bar';
            seatEl.appendChild(b);
            seatEl.appendChild(l);

            if (!isTaken(r, c)) {
              seatEl.addEventListener('click', () => {
                if (state.mode !== 'SEATED') return;
                const groups = getAllValidGroups(state.ticketCount).filter(
                  g => g.r === r && g.cols.includes(c)
                );
                if (groups.length > 0) {
                  const sRef = SEAT_BY_RC[r][c];
                  const best = groups.reduce((a, b) =>
                    Math.abs(a.cx - sRef.dx) <= Math.abs(b.cx - sRef.dx) ? a : b
                  );
                  commitSeatSelection(best.r, best.cols);
                }
              });
            }
            (c <= 6 ? leftSide : rightSide).appendChild(seatEl);
          }

          const aisle = document.createElement('div');
          aisle.className = 'mini-aisle';

          const rLbl = document.createElement('div');
          rLbl.className = 'mini-row-label';
          rLbl.textContent = ROWS[r];

          rowEl.appendChild(leftSide);
          rowEl.appendChild(aisle);
          rowEl.appendChild(rightSide);
          rowEl.appendChild(rLbl);
          miniMapTrack.appendChild(rowEl);
        }
      }

      function updateMiniMap() {
        const rowEls = miniMapTrack.children;
        for (let r = 0; r < 8; r++) {
          const rowEl = rowEls[r];
          const dist = Math.abs(r - state.selectedRow);
          rowEl.classList.toggle('is-active', dist === 0);
          rowEl.classList.toggle('is-near', dist === 1);
          rowEl.classList.toggle('is-far', dist >= 2);

          const seats = rowEl.querySelectorAll('.mini-seat');
          seats.forEach(el => {
            const c = Number(el.dataset.col);
            const taken = isTaken(r, c);
            const selected = r === state.selectedRow && state.selectedCols.includes(c);
            el.className = 'mini-seat ' + (selected ? 'selected' : taken ? 'taken' : 'free');
            el.firstChild.textContent = selected ? String(c) : '';
          });
        }
        // Center the selected row inside the 100px viewport (row height 24px + gap 7px = 31px pitch)
        const offsetY = 50 - (state.selectedRow * 31 + 12);
        miniMapTrack.style.transform = `translateY(${offsetY}px)`;
      }

      function commitSeatSelection(r, cols) {
        state.selectedRow = r;
        state.selectedCols = cols.slice();
        renderSelectedSeats2D();
        updateSummaryUI();
        updateMiniMap();
        sync3DSelectedSeats();
      }

      buildMiniMap();
      renderSelectedSeats2D();
      updateSummaryUI();
      updateMiniMap();

      /* =====================================================================
         6. GRAB & DRAG SELECTED SEATS INTERACTION
            - Hover blue seats -> open hand (grab)
            - Press -> closed hand (grabbing), blue cluster lifts smoothly,
              original spots reveal hollow Free seats
            - Drag -> solid blue seats track pointer, thin blue hollow outline
              marks nearest valid group (can cross central aisle e.g. G9-10 -> E5-6),
              white floating pill ~25px above pointer shows candidate ("Row F · 8–9")
            - Bottom summary stays on previous selection until release!
            - Release -> blue cluster settles gently into target outline, pill vanishes,
              bottom summary updates!
         ===================================================================== */
      let activeDragClusterEl = null;

      function clientToDesign(clientX, clientY) {
        return {
          x: (clientX - state.designOriginX) / state.designScale,
          y: (clientY - state.designOriginY) / state.designScale
        };
      }

      function positionDragTooltip(clientX, clientY, cand, isTouch) {
        if (!cand) {
          dragTooltip.classList.remove('visible');
          return;
        }
        const rowLetter = ROWS[cand.r];
        dragTooltip.textContent = `Row ${rowLetter} · ${formatSeatRange(cand.cols)}`;
        // Float ~25px above mouse cursor, or ~50px above finger on touchscreens so thumb doesn't cover text
        const tipScale = THREE.MathUtils.clamp(state.designScale, 0.76, 1.0);
        const liftPx = isTouch ? 52 : Math.round(25 * tipScale);
        dragTooltip.style.setProperty('--tip-scale', tipScale.toFixed(3));
        dragTooltip.style.left = `${THREE.MathUtils.clamp(clientX, 64, state.vw - 64)}px`;
        dragTooltip.style.top = `${Math.max(44, clientY - liftPx)}px`;
        dragTooltip.classList.add('visible');
      }

      function onSelectedSeatPointerDown(e) {
        if (state.mode !== 'MAP' || state.drag.active) return;
        if (e.button !== undefined && e.button !== 0) return;
        e.preventDefault();

        const isTouch = e.pointerType === 'touch';
        const p = clientToDesign(e.clientX, e.clientY);
        const cols = state.selectedCols;
        const r = state.selectedRow;

        let cx = 0, cy = 0;
        const relSeats = [];
        for (const col of cols) {
          const s = SEAT_BY_RC[r][col];
          cx += s.dx;
          cy += s.dy;
        }
        cx /= cols.length;
        cy /= cols.length;

        for (const col of cols) {
          const s = SEAT_BY_RC[r][col];
          relSeats.push({
            col,
            ox: s.dx - cx,
            oy: s.dy - cy,
            sw: s.sw,
            sh: s.sh
          });
        }

        state.drag.active = true;
        state.drag.pointerId = e.pointerId;
        state.drag.isTouch = isTouch;
        state.drag.grabOffsetX = cx - p.x;
        state.drag.grabOffsetY = (cy - p.y) - (isTouch ? 24 : 0);
        state.drag.clusterX = cx;
        state.drag.clusterY = cy;
        state.drag.relSeats = relSeats;
        state.drag.candidate = { r, cols: cols.slice(), cx, cy };

        document.body.classList.add('is-dragging-seats');
        renderSelectedSeats2D(); // Clears selected layer -> exposes original hollow free seats!
        renderGhostCandidate(state.drag.candidate);

        // Build lifted floating blue cluster
        dragLayer.innerHTML = '';
        const cluster = document.createElement('div');
        cluster.className = 'drag-cluster';
        for (const rs of relSeats) {
          const node = createSeatDom(rs.sw, rs.sh, 'lifted', String(rs.col));
          node.style.left = `${rs.ox.toFixed(2)}px`;
          node.style.top = `${rs.oy.toFixed(2)}px`;
          cluster.appendChild(node);
        }
        const liftY = isTouch ? 24 : 5;
        cluster.style.transform = `translate3d(${cx.toFixed(2)}px, ${(cy - liftY).toFixed(2)}px, 0) scale(1.07)`;
        dragLayer.appendChild(cluster);
        activeDragClusterEl = cluster;

        positionDragTooltip(e.clientX, e.clientY, state.drag.candidate, isTouch);

        window.addEventListener('pointermove', onDragPointerMove, { passive: false });
        window.addEventListener('pointerup', onDragPointerUp);
        window.addEventListener('pointercancel', onDragPointerUp);
      }

      function onDragPointerMove(e) {
        if (!state.drag.active) return;
        e.preventDefault();
        const p = clientToDesign(e.clientX, e.clientY);
        const cx = p.x + state.drag.grabOffsetX;
        const cy = p.y + state.drag.grabOffsetY;
        state.drag.clusterX = cx;
        state.drag.clusterY = cy;

        if (activeDragClusterEl) {
          activeDragClusterEl.style.transition = 'none';
          activeDragClusterEl.style.transform = `translate3d(${cx.toFixed(2)}px, ${(cy - 5).toFixed(2)}px, 0) scale(1.07)`;
        }

        const nearest = findNearestValidGroup(cx, cy, state.ticketCount);
        if (nearest) {
          const prev = state.drag.candidate;
          if (!prev || prev.r !== nearest.r || prev.cols[0] !== nearest.cols[0]) {
            state.drag.candidate = nearest;
            renderGhostCandidate(nearest);
          }
          positionDragTooltip(e.clientX, e.clientY, nearest, state.drag.isTouch);
        }
      }

      function onDragPointerUp(e) {
        if (!state.drag.active) return;
        window.removeEventListener('pointermove', onDragPointerMove);
        window.removeEventListener('pointerup', onDragPointerUp);
        window.removeEventListener('pointercancel', onDragPointerUp);

        document.body.classList.remove('is-dragging-seats');
        dragTooltip.classList.remove('visible');

        const target = state.drag.candidate || {
          r: state.selectedRow,
          cols: state.selectedCols,
          cx: state.drag.clusterX,
          cy: state.drag.clusterY
        };

        // Smoothly settle lifted blue seats into the target hollow outline
        const settlingCluster = activeDragClusterEl;
        activeDragClusterEl = null;

        if (settlingCluster) {
          // Update seat numbers & inter-seat spacing to match the destination row perspective
          const nodes = settlingCluster.children;
          for (let i = 0; i < nodes.length && i < target.cols.length; i++) {
            const destSeat = SEAT_BY_RC[target.r][target.cols[i]];
            nodes[i].style.transition = 'left 0.2s cubic-bezier(0.22,1,0.36,1), top 0.2s cubic-bezier(0.22,1,0.36,1)';
            nodes[i].style.left = `${(destSeat.dx - target.cx).toFixed(2)}px`;
            nodes[i].style.top = `${(destSeat.dy - target.cy).toFixed(2)}px`;
            nodes[i].style.setProperty('--sw', `${destSeat.sw.toFixed(2)}px`);
            nodes[i].style.setProperty('--sh', `${destSeat.sh.toFixed(2)}px`);
            nodes[i].firstChild.textContent = String(target.cols[i]);
          }
          settlingCluster.style.transition = 'transform 0.22s cubic-bezier(0.22, 1, 0.36, 1)';
          settlingCluster.style.transform = `translate3d(${target.cx.toFixed(2)}px, ${target.cy.toFixed(2)}px, 0) scale(1.0)`;
        }

        // Update selection data & bottom bar right on drop
        state.selectedRow = target.r;
        state.selectedCols = target.cols.slice();
        updateSummaryUI();
        updateMiniMap();
        sync3DSelectedSeats();

        setTimeout(() => {
          state.drag.active = false;
          state.drag.candidate = null;
          dragLayer.innerHTML = '';
          ghostLayer.innerHTML = '';
          renderSelectedSeats2D();
        }, 225);
      }

      /* =====================================================================
         7. TICKET COUNT STEPPER & BOOKING ACTION
         ===================================================================== */
      function changeTicketCount(delta) {
        const nextCount = THREE.MathUtils.clamp(state.ticketCount + delta, 1, 4);
        if (nextCount === state.ticketCount) return;

        // Compute current center so we keep the user in the same spot if possible
        let cx = 0, cy = 0;
        for (const col of state.selectedCols) {
          cx += SEAT_BY_RC[state.selectedRow][col].dx;
          cy += SEAT_BY_RC[state.selectedRow][col].dy;
        }
        cx /= state.selectedCols.length;
        cy /= state.selectedCols.length;

        const sameRowGroups = getAllValidGroups(nextCount).filter(g => g.r === state.selectedRow);
        let picked = null;
        if (sameRowGroups.length > 0) {
          picked = sameRowGroups.reduce((a, b) =>
            Math.abs(a.cx - cx) <= Math.abs(b.cx - cx) ? a : b
          );
        } else {
          picked = findNearestValidGroup(cx, cy, nextCount);
        }
        if (!picked) return;

        state.ticketCount = nextCount;
        commitSeatSelection(picked.r, picked.cols);
      }

      btnMinus.addEventListener('click', () => changeTicketCount(-1));
      btnPlus.addEventListener('click', () => changeTicketCount(1));

      let toastTimer = null;
      btnBook.addEventListener('click', () => {
        const rowLetter = ROWS[state.selectedRow];
        const total = (state.ticketCount * TICKET_PRICE).toFixed(2);
        bookingToast.textContent = `Confirmed · Row ${rowLetter}, Seats ${formatSeatRange(state.selectedCols)} (€${total})`;
        bookingToast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => bookingToast.classList.remove('show'), 2600);
      });

      /* =====================================================================
         8. SEATED LOOK-AROUND (HORIZONTAL DRAG IN PLACE)
         ===================================================================== */
      let lookDrag = { active: false, pointerId: null, startX: 0, startY: 0, baseYaw: 0, basePitch: 0 };

      lookLayer.addEventListener('pointerdown', (e) => {
        if (state.mode !== 'SEATED') return;
        if (e.button !== undefined && e.button !== 0) return;
        lookDrag.active = true;
        lookDrag.pointerId = e.pointerId;
        lookDrag.startX = e.clientX;
        lookDrag.startY = e.clientY;
        lookDrag.baseYaw = state.lookYawTarget;
        lookDrag.basePitch = state.lookPitchTarget;
        lookLayer.classList.add('dragging');
        lookLayer.setPointerCapture(e.pointerId);
      });

      lookLayer.addEventListener('pointermove', (e) => {
        if (!lookDrag.active || state.mode !== 'SEATED') return;
        const dx = e.clientX - lookDrag.startX;
        const dy = e.clientY - lookDrag.startY;
        // Dragging right turns head left (or natural panoramic drag-the-world feel):
        // Let dragging mouse LEFT look LEFT? Wait: test both intuitions:
        // Prompt: "按住并横向拖动即可坐在原位左右转头。朝左看时，左墙灯带逐渐铺满视野，银幕向右侧滑出；反向拖动可以看见右墙。"
        // In 360 viewers / Google Street View, dragging RIGHT pulls the left wall into view (screen slides right -> looking LEFT)!
        // Let's make horizontal drag crisp and responsive (~0.0024 rad/px)
        const sensitivity = 0.00235;
        state.lookYawTarget = THREE.MathUtils.clamp(
          lookDrag.baseYaw + dx * sensitivity,
          THREE.MathUtils.degToRad(-74),
          THREE.MathUtils.degToRad(74)
        );
        // Subtle vertical micro-freedom so looking around feels alive without breaking framing
        state.lookPitchTarget = THREE.MathUtils.clamp(
          lookDrag.basePitch + dy * 0.00075,
          THREE.MathUtils.degToRad(-10),
          THREE.MathUtils.degToRad(14)
        );
      });

      function endLookDrag() {
        if (!lookDrag.active) return;
        lookDrag.active = false;
        lookLayer.classList.remove('dragging');
      }
      lookLayer.addEventListener('pointerup', endLookDrag);
      lookLayer.addEventListener('pointercancel', endLookDrag);

      // Double-click in seated view smoothly re-centers gaze on screen
      lookLayer.addEventListener('dblclick', () => {
        if (state.mode !== 'SEATED') return;
        state.lookYawTarget = 0;
        state.lookPitchTarget = 0;
      });

      /* =====================================================================
         9. PREVIEW <-> SEATS 4-SECOND TIMELINE TRANSITION
            Forward (0.0 -> 4.0s):
              0.0–0.8s: 3D theater reveals under aligned 2D map, then 2D fades out
              0.8–3.4s: Smooth S-curve arc flight from overview to seated eye height;
                        HUD smoothly migrates to viewport corners & bottom
              3.4–4.0s: Camera settles, translucent mini seat map emerges,
                        Preview button becomes four-square icon + "Seats"
            Reverse (Seats clicked, 4.0 -> 0.0s):
              Mini map fades out first, look-around smoothly centers, camera flies
              back along the entry path to overview alignment, 2D map reappears over
              aligned 3D seats, theater fades back to #0C0C0C.
         ===================================================================== */
      let returnStartYaw = 0;
      let returnStartPitch = 0;

      btnPreview.addEventListener('click', () => {
        if (state.drag.active) return;
        if (state.mode === 'MAP') {
          state.mode = 'FLY_IN';
          state.animTime = 0;
          state.lookYaw = 0;
          state.lookYawTarget = 0;
          state.lookPitchOffset = 0;
          state.lookPitchTarget = 0;
          const st = getSeatedTargetForSelection(state.selectedRow, state.selectedCols);
          state.seatedCamPos = st.pos.clone();
          state.seatedCamYaw = st.yaw;
          state.seatedCamPitch = st.pitch;
        } else if (state.mode === 'SEATED') {
          state.mode = 'FLY_OUT';
          state.animTime = 4.0;
          returnStartYaw = state.lookYaw;
          returnStartPitch = state.lookPitchOffset;
          lookLayer.classList.remove('active', 'dragging');
        } else if (state.mode === 'FLY_IN') {
          state.mode = 'FLY_OUT';
          returnStartYaw = 0;
          returnStartPitch = 0;
        } else if (state.mode === 'FLY_OUT') {
          state.mode = 'FLY_IN';
        }
      });

      /* =====================================================================
         10. CAMERA PROJECTION, HUD INTERPOLATION & RENDER LOOP
         ===================================================================== */
      function computeViewportMetrics() {
        const vw = window.innerWidth;
        const vh = window.innerHeight;
        state.vw = vw;
        state.vh = vh;
        // Desktop preserves the exact 1000x1000 design canvas framing;
        // Portrait phones focus comfortably on the 512px interactive core so seats are easy to grab with one thumb!
        const sBase = Math.min(vw, vh) / 1000;
        let s = sBase;
        if (vw < 720 || vw < vh * 0.92) {
          const sFocus = Math.min((vw - 24) / 512, (vh - 48) / 700);
          s = Math.min(1.0, Math.max(sBase, sFocus));
        }
        state.designScale = s;
        state.designOriginX = (vw - 1000 * s) * 0.5;
        state.designOriginY = (vh - 1000 * s) * 0.5;

        mapStage.style.transform = `translate3d(${state.designOriginX}px, ${state.designOriginY}px, 0) scale(${s})`;

        renderer.setSize(vw, vh, false);
        camera.aspect = vw / vh;
      }

      // Compute exact vertical FOV so Overview 3D projection matches 1000x1000 stage 1:1 at ANY aspect ratio
      function getOverviewActualFov() {
        const tanHalfDesign = Math.tan(THREE.MathUtils.degToRad(OVERVIEW_CAM.fovDesign * 0.5));
        const tanHalfActual = (state.vh / (1000 * state.designScale)) * tanHalfDesign;
        return THREE.MathUtils.radToDeg(2 * Math.atan(tanHalfActual));
      }

      // Compute Seated vertical FOV so when sitting in E5–6 the 9.2m screen covers ~70% of desktop viewport width
      // and expands gracefully on narrow portrait phones so the AVENGERS: DOOMSDAY screen remains cleanly framed!
      function getSeatedActualFov() {
        const aspect = state.vw / state.vh;
        if (aspect < 0.85) {
          // Portrait mobile phone: natural wide theater lens so title + screen stay cleanly legible
          const portraitFov = THREE.MathUtils.lerp(88, 74, THREE.MathUtils.clamp((aspect - 0.44) / 0.41, 0, 1));
          return THREE.MathUtils.clamp(portraitFov, 74, 90);
        }
        // Desktop / landscape: Screen half-width 4.6m at z=8.38m -> tan(halfScreenAngle) = 0.549
        // For ~70% horizontal screen coverage: tan(hfov/2) = 0.549 / 0.70 = 0.785
        const targetTanHalfH = 0.790;
        const tanHalfV = targetTanHalfH / Math.max(0.95, Math.min(1.92, aspect));
        const vfov = THREE.MathUtils.radToDeg(2 * Math.atan(tanHalfV));
        return THREE.MathUtils.clamp(vfov, 46, 76);
      }

      // Smooth S-curve: slow start, accelerated mid-section, gentle deceleration into the seat
      function easeFlight(u) {
        u = THREE.MathUtils.clamp(u, 0, 1);
        // Quintic smootherstep blended slightly toward graceful long landing
        const s = u * u * u * (u * (u * 6 - 15) + 10);
        return s;
      }

      function easeInOutCubic(u) {
        u = THREE.MathUtils.clamp(u, 0, 1);
        return u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
      }

      function cubicBezierVec3(p0, p1, p2, p3, t, out) {
        const mt = 1 - t;
        const a = mt * mt * mt;
        const b = 3 * mt * mt * t;
        const c = 3 * mt * t * t;
        const d = t * t * t;
        out.set(
          a * p0.x + b * p1.x + c * p2.x + d * p3.x,
          a * p0.y + b * p1.y + c * p2.y + d * p3.y,
          a * p0.z + b * p1.z + c * p2.z + d * p3.z
        );
        return out;
      }

      // Position the 3 HUD blocks smoothly between design-stage coordinates (p=0) and preview-anchored coordinates (p=1)
      function updateHudLayout(hudProgress) {
        const p = easeInOutCubic(hudProgress);
        const s = state.designScale;
        const ox = state.designOriginX;
        const oy = state.designOriginY;
        const vw = state.vw;
        const vh = state.vh;

        // Preview-mode HUD scale & edge padding (clean 24px/28px on desktop, compact non-overlapping on narrow phones)
        const isNarrow = vw < 640;
        const edgePad = isNarrow ? 16 : 24;
        const botPad = isNarrow ? 22 : 28;
        const hudScalePreview = isNarrow
          ? THREE.MathUtils.clamp((vw - edgePad * 2) / 485, 0.58, 0.84)
          : THREE.MathUtils.clamp(Math.min(vw / 1180, vh / 860), 0.72, 1.0);
        const curScale = THREE.MathUtils.lerp(s, hudScalePreview, p);

        // 1. Header: map=(244, 166) -> preview=(edgePad, edgePad)
        const hMapX = ox + 244 * s;
        const hMapY = oy + 166 * s;
        const hPrevX = edgePad;
        const hPrevY = edgePad;
        const hx = THREE.MathUtils.lerp(hMapX, hPrevX, p);
        const hy = THREE.MathUtils.lerp(hMapY, hPrevY, p);
        hudHeader.style.transform = `translate3d(${hx.toFixed(1)}px, ${hy.toFixed(1)}px, 0) scale(${curScale.toFixed(4)})`;

        // 2. Ticket Stepper (188x48): map right-aligned to x=756 -> preview top-right
        const stMapX = ox + (756 - 188) * s;
        const stMapY = oy + 167 * s;
        const stPrevX = vw - edgePad - 188 * hudScalePreview;
        const stPrevY = edgePad;
        const stx = THREE.MathUtils.lerp(stMapX, stPrevX, p);
        const sty = THREE.MathUtils.lerp(stMapY, stPrevY, p);
        hudStepper.style.transform = `translate3d(${stx.toFixed(1)}px, ${sty.toFixed(1)}px, 0) scale(${curScale.toFixed(4)})`;

        // 3. Bottom Purchase Area (512px wide; summary row 46px + 64px buttons = 110px tall):
        //    In design canvas: buttons top at y=764 -> block top at y=718 (buttons end at 828)
        //    In preview mode: centered horizontally, 512px wide (scaled cleanly on phones), ~28px from bottom
        const botScalePreview = isNarrow
          ? Math.min(0.88, (vw - 24) / 512)
          : Math.min(1.0, (vw - 32) / 512, Math.max(0.78, vh / 880));
        const curBotScale = THREE.MathUtils.lerp(s, botScalePreview, p);
        const bMapX = ox + 244 * s;
        const bMapY = oy + 718 * s;
        const bPrevX = (vw - 512 * botScalePreview) * 0.5;
        const bPrevY = vh - botPad - 110 * botScalePreview;
        const bx = THREE.MathUtils.lerp(bMapX, bPrevX, p);
        const by = THREE.MathUtils.lerp(bMapY, bPrevY, p);
        hudBottom.style.transform = `translate3d(${bx.toFixed(1)}px, ${by.toFixed(1)}px, 0) scale(${curBotScale.toFixed(4)})`;
      }

      const vecP0 = new THREE.Vector3(0, OVERVIEW_CAM.y, OVERVIEW_CAM.z);
      const vecP1 = new THREE.Vector3();
      const vecP2 = new THREE.Vector3();
      const vecCam = new THREE.Vector3();

      function applyTimeline(t, dt, elapsed) {
        // t in [0, 4.0]
        // --- Phase 1: 0.0 - 0.8s (Reveal 3D theater aligned under 2D map, then fade 2D out) ---
        // Veil fades out over 0.0 -> 0.44s so the 3D hall & aligned blue cushions clearly show right behind the 2D seats
        const veilAlpha = 1.0 - easeInOutCubic(THREE.MathUtils.clamp(t / 0.44, 0, 1));
        theaterVeil.style.opacity = veilAlpha.toFixed(4);
        theaterVeil.style.display = veilAlpha <= 0.002 ? 'none' : 'block';

        // After full alignment is clearly visible (~0.44-0.50s), fade out 2D seat outlines, screen arc, row labels, legend
        const mapChromeOpacity = 1.0 - easeInOutCubic(THREE.MathUtils.clamp((t - 0.48) / 0.28, 0, 1));
        // Blue 2D selected seat icons linger slightly longer (0.54->0.80s) so the eye watches them become the 3D blue cushions!
        const blueIconsOpacity = 1.0 - easeInOutCubic(THREE.MathUtils.clamp((t - 0.54) / 0.26, 0, 1));

        screenArcGroup.style.opacity = mapChromeOpacity.toFixed(4);
        staticLayer.style.opacity = mapChromeOpacity.toFixed(4);
        legendRow.style.opacity = mapChromeOpacity.toFixed(4);
        mapDivider.style.opacity = mapChromeOpacity.toFixed(4);
        selectedLayer.style.opacity = blueIconsOpacity.toFixed(4);

        const mapInteractive = t <= 0.02 && state.mode === 'MAP';
        mapStage.style.visibility = blueIconsOpacity <= 0.002 ? 'hidden' : 'visible';
        selectedLayer.style.pointerEvents = mapInteractive ? 'auto' : 'none';
        staticLayer.style.pointerEvents = mapInteractive ? 'auto' : 'none';

        // --- Phase 2: 0.8 - 3.4s (Smooth arc camera flight + HUD migration) ---
        const uFlightRaw = THREE.MathUtils.clamp((t - 0.8) / 2.6, 0, 1);
        const uPos = easeFlight(uFlightRaw);
        // Pitch lifts slightly ahead of final arrival so the screen sweeps dramatically down from the top edge
        const uLook = easeFlight(Math.pow(uFlightRaw, 0.90));
        const uFov = easeInOutCubic(uFlightRaw);

        // Seated target position (smoothly interpolates if user switches seats while already seated)
        const targetSeat = getSeatedTargetForSelection(state.selectedRow, state.selectedCols);
        if (!state.seatedCamPos) {
          state.seatedCamPos = targetSeat.pos.clone();
          state.seatedCamYaw = targetSeat.yaw;
          state.seatedCamPitch = targetSeat.pitch;
        } else if (state.mode === 'SEATED') {
          const k = 1 - Math.exp(-dt * 6.5);
          state.seatedCamPos.lerp(targetSeat.pos, k);
          state.seatedCamYaw = THREE.MathUtils.lerp(state.seatedCamYaw, targetSeat.yaw, k);
          state.seatedCamPitch = THREE.MathUtils.lerp(state.seatedCamPitch, targetSeat.pitch, k);
        } else {
          state.seatedCamPos.copy(targetSeat.pos);
          state.seatedCamYaw = targetSeat.yaw;
          state.seatedCamPitch = targetSeat.pitch;
        }

        // Control points for sweeping cinema arc from rear-above down into the chosen seats
        vecP1.set(
          state.seatedCamPos.x * 0.14,
          15.8,
          14.6
        );
        vecP2.set(
          state.seatedCamPos.x * 0.84,
          state.seatedCamPos.y + 3.25,
          state.seatedCamPos.z + 2.95
        );

        cubicBezierVec3(vecP0, vecP1, vecP2, state.seatedCamPos, uPos, vecCam);
        camera.position.copy(vecCam);

        // Look-around damping when seated, or smooth re-centering during FLY_OUT
        let activeLookYaw = 0;
        let activeLookPitch = 0;
        if (state.mode === 'SEATED') {
          const damp = 1 - Math.exp(-dt * 10.5);
          state.lookYaw = THREE.MathUtils.lerp(state.lookYaw, state.lookYawTarget, damp);
          state.lookPitchOffset = THREE.MathUtils.lerp(state.lookPitchOffset, state.lookPitchTarget, damp);
          activeLookYaw = state.lookYaw;
          activeLookPitch = state.lookPitchOffset;
        } else if (state.mode === 'FLY_OUT') {
          // Smoothly unwind any head-turn over the first 0.7s of return (4.0 -> 3.3s)
          const unwind = easeInOutCubic(THREE.MathUtils.clamp((t - 3.3) / 0.7, 0, 1));
          activeLookYaw = returnStartYaw * unwind;
          activeLookPitch = returnStartPitch * unwind;
        }

        const pitch0 = -THREE.MathUtils.degToRad(OVERVIEW_CAM.pitchDeg);
        const curPitch = THREE.MathUtils.lerp(pitch0, state.seatedCamPitch, uLook) + activeLookPitch;
        const curYaw = THREE.MathUtils.lerp(0, state.seatedCamYaw, uLook) + activeLookYaw;

        camera.rotation.set(curPitch, curYaw, 0, 'YXZ');

        const fovOver = getOverviewActualFov();
        const fovSeat = getSeatedActualFov();
        camera.fov = THREE.MathUtils.lerp(fovOver, fovSeat, uFov);
        camera.updateProjectionMatrix();

        // Seamlessly fade ceiling & ceiling spotlights as camera descends below ceiling plane (no clipping pop)
        const ceilVis = THREE.MathUtils.clamp((7.8 - camera.position.y) / 1.7, 0, 1);
        ceilingGroup.visible = ceilVis > 0.005;
        ceilingMat.opacity = ceilVis;
        for (let i = 0; i < ceilingSpotMats.length; i++) {
          const baseOp = i % 2 === 0 ? 0.78 : 0.36;
          ceilingSpotMats[i].opacity = baseOp * ceilVis;
        }

        // HUD migration follows the flight segment 0.8 -> 3.4s
        updateHudLayout(uFlightRaw);

        // --- Phase 3: 3.4 - 4.0s (Mini seat map fades in, Preview button becomes Seats) ---
        const miniProg = easeInOutCubic(THREE.MathUtils.clamp((t - 3.42) / 0.56, 0, 1));
        miniMapWrap.style.opacity = miniProg.toFixed(4);
        miniMapWrap.style.transform = `translateX(-50%) translateY(${((1 - miniProg) * 10).toFixed(2)}px)`;
        miniMapWrap.classList.toggle('interactive', state.mode === 'SEATED' && miniProg > 0.95);

        const showSeatsBtn = t >= 3.45;
        btnPreview.classList.toggle('is-seats', showSeatsBtn);
        btnPreviewLabel.textContent = showSeatsBtn ? 'Seats' : 'Preview';

        // Subtle cinema projector breathing on the localized screen bounce light
        const flicker = 1.0 + Math.sin(elapsed * 2.1) * 0.022 + Math.sin(elapsed * 5.7) * 0.01;
        screenBounceCenter.intensity = 0.72 * flicker;
        screenBounceLow.intensity = 0.56 * flicker;
      }

      computeViewportMetrics();
      window.addEventListener('resize', () => {
        computeViewportMetrics();
        applyTimeline(state.animTime, 0.016, 0);
      });

      // Main 60fps Animation Loop
      let lastTs = performance.now();
      let startTs = lastTs;

      function tick(now) {
        requestAnimationFrame(tick);
        const dt = Math.min(0.05, Math.max(0.001, (now - lastTs) / 1000));
        lastTs = now;
        const elapsed = (now - startTs) / 1000;

        if (state.mode === 'FLY_IN') {
          state.animTime += dt;
          if (state.animTime >= 4.0) {
            state.animTime = 4.0;
            state.mode = 'SEATED';
            lookLayer.classList.add('active');
          }
        } else if (state.mode === 'FLY_OUT') {
          state.animTime -= dt;
          if (state.animTime <= 0) {
            state.animTime = 0;
            state.mode = 'MAP';
            state.lookYaw = 0;
            state.lookYawTarget = 0;
            state.lookPitchOffset = 0;
            state.lookPitchTarget = 0;
          }
        }

        applyTimeline(state.animTime, dt, elapsed);

        // Only run WebGL render when theater is at least slightly visible (saves GPU on pure black map screen)
        if (state.animTime > 0.001 || state.mode !== 'MAP') {
          renderer.render(scene, camera);
        }
      }

      // Render one initial frame so shaders & textures are pre-warmed (zero stutter on Preview click!)
      applyTimeline(0, 0.016, 0);
      renderer.render(scene, camera);
      requestAnimationFrame(tick);

      // Expose read-only inspection helper for verification
      window.__cinemaDebug = {
        getState: () => ({
          mode: state.mode,
          animTime: state.animTime,
          selectedRow: ROWS[state.selectedRow],
          selectedCols: state.selectedCols.slice(),
          ticketCount: state.ticketCount,
          camPos: camera.position.toArray().map(v => +v.toFixed(2)),
          camFov: +camera.fov.toFixed(2)
        }),
        getRowProj: () => ROW_PROJ.map(r => ({ row: ROWS[r.row], y: +r.y.toFixed(2), leftX: +r.leftX.toFixed(1), rightX: +r.rightX.toFixed(1) }))
      };
    }

    window.__bootCinemaApp = bootApp;
    if (typeof THREE !== 'undefined') {
      bootApp();
    } else {
      window.addEventListener('load', bootApp);
    }
  })();
  </script>
</body>
</html>
